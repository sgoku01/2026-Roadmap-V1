<html lang="en">
<head>

<title>Swapna PM Roadmap tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light;

  /* Signature — required on every TR asset */
  --tr-orange: #D64000;

  /* Foundational — Racing Green only. Never alongside Bold Navy. */
  --tr-racing-green: #123015;

  /* Utility */
  --tr-white: #FFFFFF;
  --tr-graphite: #212223;   /* body copy — never a background fill */
  --tr-gray-1: #F9F7F5;     /* the only grey permitted as a background */
  --tr-gray-2: #E5E5E5;     /* dividers, table rows */
  --tr-gray-3: #9F9F9F;     /* borders and strokes only — fails AA for text */
  --tr-gray-4: #7A7A7A;     /* borders, inactive states, captions */

  /* Data-visualisation palette — charts only, never layout or type */
  --dv-orange: #D64000;
  --dv-green: #123015;
  --dv-sky: #0874E3;
  --dv-teal: #4DB299;
  --dv-grid: #E5E5E5;
  --dv-bg: #F9F7F5;

  --tr-font: "Clario", "Arial", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px 18px 40px;
  background: var(--tr-white); color: var(--tr-graphite);
  font: 14px/1.55 var(--tr-font);
}
h1 {
  font-size: 22px; margin: 0 0 3px; font-weight: 500;
  color: var(--tr-racing-green); letter-spacing: -0.01em;
}
.sub { color: var(--tr-gray-4); font-size: 12.5px; margin-bottom: 4px; }
.sub a { color: var(--tr-orange); text-decoration: none; }
.sub a:hover { text-decoration: underline; }
/* Signature orange rule under the masthead — per the TR dashboard layout pattern */
.rule { height: 3px; background: var(--tr-orange); margin: 0 0 16px; }

#status { padding: 11px 13px; border-radius: 8px; background: var(--tr-gray-1);
          color: var(--tr-graphite); font-size: 13px; margin-bottom: 14px;
          border-left: 4px solid var(--tr-orange); }
#status.err { border-left-color: var(--tr-orange); background: var(--tr-gray-1);
              color: var(--tr-orange); font-weight: 500; }
.hide { display: none !important; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); gap: 9px; margin-bottom: 14px; }
/* Metric card per the TR dashboard pattern: white, left signature accent */
.kpi { border: 1px solid var(--tr-gray-2); border-left: 4px solid var(--tr-gray-3);
       border-radius: 8px; padding: 11px 13px; background: var(--tr-white); }
.kpi .n { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15;
          color: var(--tr-racing-green); }
.kpi .l { font-size: 11px; color: var(--tr-graphite); letter-spacing: 0.02em; margin-top: 2px; }
.kpi .s { font-size: 11.5px; color: var(--tr-gray-4); margin-top: 4px; }
/* Status tiers. The TR alert colours are retired, so urgency is carried by the
   Signature orange, "good" by the Foundational green, neutral by functional grey. */
.kpi.bad { border-left-color: var(--tr-orange); }
.kpi.bad .n { color: var(--tr-orange); }
.kpi.warn { border-left-color: var(--tr-gray-4); }
.kpi.warn .n { color: var(--tr-graphite); }
.kpi.good { border-left-color: var(--tr-racing-green); }
.kpi.good .n { color: var(--tr-racing-green); }

/* Breach banner — Foundational green field, white body copy, orange accent. */
.alert { background: var(--tr-racing-green); border-radius: 8px;
         padding: 13px 16px; margin-bottom: 14px; font-size: 13px; color: var(--tr-white);
         border-left: 4px solid var(--tr-orange); }
.alert b { font-weight: 500; }
.alert .hl { color: var(--tr-white); font-weight: 500; font-size: 14.5px; }
.alert ul { margin: 7px 0 0; padding-left: 18px; }
.alert li { margin: 3px 0; }
.alert a { color: var(--tr-white); font-weight: 500; }

/* ---- headline: verdict + health strip ---------------------------------- */
.verdict { background: var(--tr-racing-green); color: var(--tr-white); border-radius: 8px;
           border-left: 4px solid var(--tr-orange); padding: 15px 18px; margin-bottom: 14px; }
.verdict .big { font-size: 17px; font-weight: 500; line-height: 1.45; }
.verdict .big b { font-weight: 500; color: var(--tr-white); }
.verdict .sml { font-size: 12.5px; margin-top: 7px; color: #CFDBD1; }
.vchips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.vchip { font: inherit; font-family: var(--tr-font); font-size: 11.5px; font-weight: 500;
         cursor: pointer; border-radius: 3px; padding: 3px 10px;
         background: rgba(255,255,255,0.14); color: var(--tr-white);
         border: 1px solid rgba(255,255,255,0.35); }
.vchip:hover { background: var(--tr-orange); border-color: var(--tr-orange); }
.vchip.hot { background: var(--tr-orange); border-color: var(--tr-orange); }
.vchip.hot:hover { background: var(--tr-white); color: var(--tr-orange); }

.hstrip { border: 1px solid var(--tr-gray-2); border-radius: 8px; padding: 14px 16px 12px;
          margin-bottom: 14px; }
.hstrip .lead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hstrip .lead .pc { font-size: 30px; font-weight: 500; letter-spacing: -0.02em;
                    color: var(--tr-racing-green); line-height: 1; }
.hstrip .lead .lbl { font-size: 12.5px; color: var(--tr-gray-4); }
.hstrip .mainbar { height: 10px; margin: 9px 0 15px; }
.trow { display: grid; grid-template-columns: 96px 50px minmax(90px, 1fr) 210px; gap: 12px;
        align-items: center; padding: 5px 0; font-size: 12.5px; }
.trow .nm { color: var(--tr-graphite); }
.trow .ct { font-size: 15px; font-weight: 500; color: var(--tr-racing-green);
            text-align: right; font-variant-numeric: tabular-nums; }
.trow .sb { display: flex; height: 9px; border-radius: 2px; overflow: hidden;
            background: var(--tr-gray-2); }
.trow .sb i { display: block; height: 100%; }
.trow .mix { font-size: 11.5px; color: var(--tr-gray-4); }
@media (max-width: 700px) {
  .trow { grid-template-columns: 84px 44px 1fr; }
  .trow .mix { display: none; }
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px;
          color: var(--tr-gray-4); margin-top: 11px; padding-top: 9px;
          border-top: 1px solid var(--tr-gray-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
            margin-right: 5px; vertical-align: -1px; }

/* ---- triage groups ----------------------------------------------------- */
.tri { border: 1px solid var(--tr-gray-2); border-radius: 8px; margin-bottom: 12px; }
.tri > .th { padding: 11px 15px; background: var(--tr-gray-1);
             border-bottom: 1px solid var(--tr-gray-2); border-radius: 8px 8px 0 0; }
.tri > .th .n { font-size: 14.5px; font-weight: 500; color: var(--tr-racing-green); }
.tri > .th .d { font-size: 11.5px; color: var(--tr-gray-4); margin-top: 3px; }
.tri.urgent { border-left: 4px solid var(--tr-orange); }
.tri.urgent > .th .n { color: var(--tr-orange); }
.tri .body { padding: 2px 15px 10px; }
.tline { display: grid; grid-template-columns: 70px minmax(120px, 1fr) 150px 82px; gap: 12px;
         align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--tr-gray-2); }
.tline:last-of-type { border-bottom: 0; }
.tline .age { font-weight: 500; color: var(--tr-orange); white-space: nowrap;
              font-variant-numeric: tabular-nums; font-size: 13px; }
.tline .who { color: var(--tr-gray-4); font-size: 11.5px; }
.tline .act { text-align: right; }
.tline .ti { font-size: 12.5px; }
@media (max-width: 700px) {
  .tline { grid-template-columns: 60px 1fr; }
  .tline > .who, .tline .act { display: none; }
}
.more { font-size: 12px; color: var(--tr-gray-4); padding: 9px 0 0; }

/* Bulk selection + bulk-edit bar */
th.selc, td.selc { width: 30px; padding-left: 10px; padding-right: 0; }
td.selc input, th.selc input { margin: 0; accent-color: var(--tr-orange); cursor: pointer; }
.bulkbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  background: var(--tr-gray-1); border: 1px solid var(--tr-gray-3);
  border-left: 3px solid var(--tr-orange); border-radius: 5px;
  padding: 9px 14px; margin-bottom: 10px; font-size: 12.5px; }
.bulkbar .btn { padding: 4px 13px; }
#ov .fgrid { display: grid; grid-template-columns: 160px minmax(0, 1fr);
  gap: 4px 14px; align-items: center; }
#ov .fgrid > label { font-size: 12px; color: var(--tr-gray-4); }
#ov .fgrid > .fnote { grid-column: 2; margin: 0 0 7px; }

/* Export-to-Excel bar above each table */
.xlbar { display: flex; justify-content: flex-end; padding: 0 0 4px; }
.xlbar button { font-size: 11.5px; }

/* ---- follow-up notes column (board-only, never written to ADO) ---------- */
td.note { width: 280px; max-width: 280px; }
.ncell { border-left: 2px solid var(--tr-gray-3); padding: 1px 0 1px 8px;
         margin-bottom: 6px; cursor: text; }
.ncell:last-of-type { margin-bottom: 0; }
.ncell.open { border-left-color: var(--tr-orange); }
.ncell.done { border-left-color: var(--tr-racing-green); opacity: 0.62; }
.ncell.done .ntxt { text-decoration: line-through; color: var(--tr-gray-4); }
.ncell .ntxt { font-size: 12.5px; line-height: 1.45; white-space: pre-wrap;
               word-break: break-word; }
.ncell .nmeta { font-size: 10.5px; color: var(--tr-gray-4); margin-top: 2px;
                display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ncell .nmeta button { font-size: 10.5px; }
.nadd { font-size: 11.5px; }
.nedit textarea { width: 100%; min-height: 58px; font: inherit; font-family: var(--tr-font);
                  font-size: 12.5px; padding: 6px 7px; border: 1px solid var(--tr-orange);
                  border-radius: 4px; resize: vertical; color: var(--tr-graphite); }
.nedit textarea:focus { outline: 2px solid var(--tr-orange); outline-offset: -2px; }
.nedit .nact { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.nedit .nact .btn { font-size: 11.5px; padding: 3px 11px; }
.nbadge { font-size: 11px; padding: 1px 8px; border-radius: 3px; font-weight: 500;
          background: var(--tr-orange); color: var(--tr-white); }
.ehealth td { font-size: 12.5px; }
.ehealth .bar { height: 8px; min-width: 70px; }

nav { display: flex; gap: 2px; border-bottom: 1px solid var(--tr-gray-2);
      margin-bottom: 16px; flex-wrap: wrap; }
nav button {
  border: 0; background: none; padding: 9px 13px; font-size: 13px; font-weight: 400;
  color: var(--tr-graphite); cursor: pointer; font-family: var(--tr-font);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
nav button:hover { color: var(--tr-orange); }
nav button.on { color: var(--tr-racing-green); font-weight: 500;
                border-bottom-color: var(--tr-orange); }

h2 { font-size: 15px; margin: 24px 0 10px; font-weight: 500; color: var(--tr-racing-green); }
h2:first-child { margin-top: 0; }

/* Data table per the TR pattern: Foundational header, white and Gray 2 rows */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-family: var(--tr-font); }
/* Freeze panes: the header row stays put while the rows scroll under it. The page
   itself is the scroll container, so top:0 pins to the viewport. border-collapse
   drops a sticky cell's own borders, which is why the header carries a solid
   background plus an explicit box-shadow rule for its bottom edge. */
th { text-align: left; font-weight: 500; color: var(--tr-white); font-size: 11.5px;
     letter-spacing: 0.01em; padding: 8px 10px; background: var(--tr-racing-green);
     white-space: nowrap; position: sticky; top: 0; z-index: 20; }
thead tr { box-shadow: 0 1px 0 var(--tr-racing-green); }
th:first-child { border-radius: 6px 0 0 0; }
th:last-child { border-radius: 0 6px 0 0; }
td { padding: 8px 10px; border-bottom: 1px solid var(--tr-gray-2);
     vertical-align: top; color: var(--tr-graphite); }
tbody tr:hover td { background: var(--tr-gray-1); }
td.id a { color: var(--tr-orange); text-decoration: none; font-variant-numeric: tabular-nums; }
td.id a:hover { text-decoration: underline; }
td.title { max-width: 460px; }
.muted { color: var(--tr-gray-4); }
.nowrap { white-space: nowrap; }

/* State chips. */
.pill { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 11px;
        font-weight: 500; white-space: nowrap; }
.p-done { background: var(--tr-racing-green); color: var(--tr-white); }
.p-prog { background: var(--tr-gray-1); color: var(--tr-graphite);
          box-shadow: inset 0 0 0 1px var(--tr-gray-3); }
.p-new  { background: var(--tr-gray-2); color: var(--tr-graphite); }
.p-blk  { background: var(--tr-orange); color: var(--tr-white); }
.p-type { background: var(--tr-white); color: var(--tr-graphite);
          box-shadow: inset 0 0 0 1px var(--tr-gray-3); }

.bar { position: relative; height: 8px; background: var(--tr-gray-2);
       border-radius: 2px; overflow: hidden; min-width: 90px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--tr-racing-green);
           border-radius: 2px; }
.bar.ok > i { background: var(--tr-racing-green); }
.bar.risk > i { background: var(--tr-orange); }

/* Branded card: white, left signature accent */
.epic { background: var(--tr-white); border: 1px solid var(--tr-gray-2);
        border-left: 4px solid var(--tr-orange); border-radius: 8px;
        padding: 13px 15px; margin-bottom: 10px; }
.epic .top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.epic .nm { font-weight: 500; font-size: 14px; color: var(--tr-racing-green); }
.epic .nm a { color: inherit; text-decoration: none; }
.epic .nm a:hover { color: var(--tr-orange); }
.epic .meta { color: var(--tr-gray-4); font-size: 11.5px; margin-top: 3px; }
.epic .pct { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; text-align: right;
             line-height: 1.1; color: var(--tr-orange); }
.epic .pctl { font-size: 10.5px; color: var(--tr-gray-4); text-align: right; letter-spacing: 0.02em; }
.epic .bar { margin-top: 10px; height: 8px; }
.epic .brk { display: flex; gap: 6px 14px; margin-top: 10px; font-size: 11.5px;
             color: var(--tr-graphite); flex-wrap: wrap; align-items: center; }
.epic .flags { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap; }
.flag { font-size: 11px; padding: 1px 8px; border-radius: 3px; font-weight: 500;
        background: var(--tr-gray-1); color: var(--tr-graphite);
        box-shadow: inset 0 0 0 1px var(--tr-gray-3); }
.flag.red { background: var(--tr-orange); color: var(--tr-white); box-shadow: none; }
.flag.ok { background: var(--tr-racing-green); color: var(--tr-white); box-shadow: none; }

.chartbox { height: 240px; border: 1px solid var(--tr-gray-2); border-radius: 8px;
            padding: 12px; background: var(--dv-bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }

select, input[type=text], input[type=date], input[type=number] {
  font: inherit; font-family: var(--tr-font); font-size: 12.5px;
  padding: 5px 8px; border: 1px solid var(--tr-gray-3); border-radius: 4px;
  background: var(--tr-white); color: var(--tr-graphite); }
select:focus, input:focus { outline: 2px solid var(--tr-orange); outline-offset: -1px; }
select:disabled, input:disabled { background: var(--tr-gray-1); color: var(--tr-gray-4); }
.rowctl { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.ctl { display: flex; flex-direction: column; gap: 2px; }
.ctl label { font-size: 10.5px; color: var(--tr-gray-4); letter-spacing: 0.02em;
             display: flex; gap: 6px; align-items: center; min-height: 15px; }
/* per-filter clear, shown only when that filter is actually set */
.clrx { border: 0; background: none; cursor: pointer; color: var(--tr-orange);
        font: inherit; font-size: 14px; line-height: 1; padding: 0; }
.clrx:hover { color: var(--tr-racing-green); }
.btn.clrall { font-size: 12px; padding: 5px 13px; border-color: var(--tr-orange);
              color: var(--tr-orange); font-weight: 500; }
.btn.clrall:hover { background: var(--tr-orange); color: var(--tr-white);
                    border-color: var(--tr-orange); }
.btn.clrall:disabled { border-color: var(--tr-gray-3); color: var(--tr-gray-4);
                       font-weight: 400; }
button.lnk { border: 0; background: none; color: var(--tr-orange); cursor: pointer;
             font: inherit; font-family: var(--tr-font); font-size: 12px; padding: 0; }
button.lnk:hover { text-decoration: underline; }
.scope { font-size: 12px; color: var(--tr-gray-4); }

/* multi-select dropdown (Drill-down State) */
.msel { position: relative; }
.msel > button { font: inherit; font-family: var(--tr-font); font-size: 12.5px;
  padding: 5px 8px; border: 1px solid var(--tr-gray-3); border-radius: 4px;
  background: var(--tr-white); color: var(--tr-graphite); cursor: pointer;
  text-align: left; min-width: 158px; display: flex; gap: 8px; align-items: center;
  justify-content: space-between; }
.msel > button:hover { border-color: var(--tr-orange); }
.msel > button .cv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 168px; }
.msel > button .ar { color: var(--tr-gray-4); font-size: 10px; }
.msel .pop { position: absolute; z-index: 30; top: calc(100% + 3px); left: 0;
  background: var(--tr-white); border: 1px solid var(--tr-gray-3); border-radius: 6px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.16); padding: 6px 0; min-width: 212px; }
.msel .pop label { display: flex; gap: 9px; align-items: center; padding: 5px 12px;
  font-size: 12.5px; cursor: pointer; }
.msel .pop label:hover { background: var(--tr-gray-1); }
.msel .pop input { margin: 0; accent-color: var(--tr-orange); }
.msel .pop .n { margin-left: auto; color: var(--tr-gray-4); font-size: 11.5px;
  font-variant-numeric: tabular-nums; }
.msel .pop .acts { display: flex; gap: 14px; padding: 8px 12px 2px; margin-top: 4px;
  border-top: 1px solid var(--tr-gray-2); }
.msel > button:disabled { background: var(--tr-gray-1); color: var(--tr-gray-4);
  cursor: default; }
.msel > button:disabled:hover { border-color: var(--tr-gray-3); }

table.tree td { padding: 6px 8px; }
.caret { border: 0; background: none; cursor: pointer; color: var(--tr-gray-4); font-size: 11px;
         width: 18px; padding: 0; text-align: left; }
.caret:hover { color: var(--tr-orange); }
.caret.dot { cursor: default; color: var(--tr-gray-3); }
.itm { display: flex; gap: 4px; align-items: baseline; }
.cnt { font-size: 11px; color: var(--tr-gray-4); white-space: nowrap; margin-left: 6px; }
.lvl0 > td { border-top: 1px solid var(--tr-gray-3); background: var(--tr-gray-1); font-weight: 500; }

/* ---- editor ---- */
.edit { border: 1px solid var(--tr-gray-3); background: var(--tr-white); border-radius: 4px;
        cursor: pointer; font: inherit; font-family: var(--tr-font); font-size: 11px;
