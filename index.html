      id: id, rev: null, loading: true, err: null,
      stage: "form", busy: false, msg: null, sect: sect || "core",
      orig: {}, draft: {},
      rich: {desc: {mode:"keep", text:"", orig:"", have:false},
             ac:   {mode:"keep", text:"", orig:"", have:false}},
      comment: String(prefillComment || ""), comments: null, cmtErr: null,
      mentions: [], mSel: 0,
      links: [], lkType: "related", lkTarget: "", lkUrl: "", lkComment: "", lkErr: null
    };
    renderEditor();

    // expand:"All" is the single richest read: every field (including the TR custom
    // ones), the HTML bodies, the relations, and the rev needed for the write guard.
    // It cannot be combined with a field filter, which is fine — we want everything.
    cmcp("wit_work_item", {action: "get", project: CTX.project, id: id, expand: "All"})
      .then(function (wi) {
        if (!ED || ED.id !== id) return;
        if (wi && wi.id) {
          DETAIL[id] = wi.fields || {};
          MLFMT[id] = wi.multilineFieldsFormat || {};
          RELS[id] = wi.relations || [];
          ED.rev = typeof wi.rev === "number" ? wi.rev : null;
          // expand:"All" returns identities as objects carrying the GUID, so every item
          // opened enriches the mention directory for free.
          IDENTITY_FIELDS.forEach(function (f) { notePerson((wi.fields || {})[f]); });
          // Keep the dashboard tables in step, but only for items the roadmap owns —
          // a support ticket must never be written into the roadmap model.
          if (CTX.syncModel && M[id]) {
            Object.keys(wi.fields || {}).forEach(function (k) { M[id].fields[k] = wi.fields[k]; });
          }
          loadRelTitles(RELS[id]);
        }
        seedDraft();
        ED.loading = false;
        renderEditor();
      })
      .catch(function (err) {
        if (!ED || ED.id !== id) return;
        // Fall back to the list-level snapshot; rich text editing is then unsafe.
        ED.err = "Could not load the full work item (" +
                 (err && err.message ? err.message : err) +
                 "). Editing the fields already on screen still works; Description and " +
                 "Acceptance criteria are unavailable, and the save will not be able to " +
                 "check for changes made by someone else.";
        seedDraft();
        ED.loading = false;
        renderEditor();
      });

    loadComments(id);
  }
  // Related items are often outside the roadmap query, so we know nothing about them.
  // One small batch read turns "#5477451" into a readable row.
  function loadRelTitles(rels) {
    var want = (rels || []).map(relWiIdOf)
      .filter(function (w) { return w && fl(w, F_TITLE) === undefined; });
    if (!want.length) return;
    var F = ["System.Id", F_TITLE, "System.WorkItemType", F_STATE];
    // Partial snapshots only — fl() falls through to M for anything absent, and a
    // later full open replaces the entry wholesale.
    var stash = function (arr) {
      var got = 0;
      (Array.isArray(arr) ? arr : (arr && arr.value) || []).forEach(function (wi) {
        if (!wi || !wi.id) return;
        got++;
        DETAIL[wi.id] = DETAIL[wi.id] || {};
        Object.keys(wi.fields || {}).forEach(function (k) {
          if (DETAIL[wi.id][k] === undefined) DETAIL[wi.id][k] = wi.fields[k];
        });
      });
      return got;
    };
    cmcp("wit_work_item", {action: "get_batch", project: CTX.project, ids: want.slice(0, 50), fields: F})
      .then(function (r) {
        // One id this project cannot resolve — a link into another project, or a
        // deleted item — makes the WHOLE batch return null rather than a partial
        // result. Observed live: id 253 among the relations of epic 4283390 blanked
        // all five of its siblings. Fall back to single reads so one bad link cannot
        // wipe out every title on the panel.
        if (stash(r) > 0) return null;
        return seq(want.slice(0, 12), function (id) {
          return cmcp("wit_work_item", {action: "get", project: CTX.project, id: id, fields: F})
            .then(function (wi) { stash([wi]); })
            .catch(function () {
              DETAIL[id] = DETAIL[id] || {};
              if (DETAIL[id][F_TITLE] === undefined) {
                DETAIL[id][F_TITLE] = "(not readable from this project)";
              }
            });
        });
      })
      .then(function () { if (ED) renderEditor(); })
      .catch(function () { /* titles are a nicety; ids alone still work */ });
  }
  function seedDraft() {
    var id = ED.id;
    cspec().forEach(function (sp) {
      var raw = fl(id, sp.f);
      ED.orig[sp.k] = normFor(sp, raw);
      ED.draft[sp.k] = ED.orig[sp.k];
    });
    crich().forEach(function (r) {
      var raw = fl(id, r.f);
      // ADO omits a field from the response when it is EMPTY, which is not the same as
      // the field being absent from the work item type. Treating the two as one made
      // every unset Description and Acceptance Criteria read-only.
      ED.rich[r.k].empty = raw === undefined || String(raw) === "";
      ED.rich[r.k].have = true;
      ED.rich[r.k].orig = raw === undefined ? "" : String(raw || "");
      ED.rich[r.k].text = "";
      ED.rich[r.k].mode = "keep";
    });
  }
  function loadComments(id) {
    cmcp("wit_work_item", {action: "list_comments", project: CTX.project, workItemId: id, top: 20})
      .then(function (r) {
        if (!ED || ED.id !== id) return;
        ED.comments = (r && r.comments) || [];
        // Comment authors carry GUIDs too — the richest source of resolved identities.
        ED.comments.forEach(function (c) { notePerson(c && c.createdBy); });
        if (ED.sect === "disc") renderEditor();
      })
      .catch(function (err) {
        if (!ED || ED.id !== id) return;
        ED.cmtErr = err && err.message ? err.message : String(err);
        ED.comments = [];
        if (ED.sect === "disc") renderEditor();
      });
  }
  function closeEditor() {
    ED = null;
    $("ov").classList.add("hide");
    $("ov").innerHTML = "";
  }

  function pendingChanges() {
    if (!ED || ED.loading) return [];
    var out = [];
    cspec().forEach(function (sp) {
      var was = ED.orig[sp.k] || "", now = ED.draft[sp.k] || "";
      // Re-ordering tags is not a change. Staging one would bump the revision and
      // stamp ChangedBy for nothing — a write is never free.
      if (sameFieldValue(sp, was, now)) return;
      out.push({
        kind: "field", spec: sp, label: sp.label, path: "/fields/" + sp.f,
        was: was, now: now,
        wasTxt: displayFor(sp, was), nowTxt: now ? displayFor(sp, now) : "cleared"
      });
    });
    crich().forEach(function (r) {
      var st = ED.rich[r.k];
      if (st.mode === "keep" || !st.text.trim()) return;
      var body = st.mode === "append"
        ? String(st.orig || "") + textToHtml(st.text)
        : textToHtml(st.text);
      out.push({
        kind: "rich", label: r.label, path: "/fields/" + r.f,
        mode: st.mode, preview: st.text.trim(), adoBody: body,
        wasTxt: st.mode === "append" ? "keep existing, add below"
          : st.empty ? "currently empty, will be written" : "replaced entirely",
        nowTxt: ""
      });
    });
    ED.links.forEach(function (l) {
      out.push({kind: "link", link: l});
    });
    return out;
  }
  function dirtySects() {
    var d = {};
    pendingChanges().forEach(function (c) {
      if (c.kind === "link") { d.details = 1; return; }
      var sp = c.spec;
      d[sp ? sp.s : "text"] = 1;
    });
    if (ED && ED.comment.trim()) d.disc = 1;
    return d;
  }

  // Link changes are queued, not written on click, so they pass through the same
  // confirmation as everything else in this drawer.
  function queueLink() {
    if (!ED) return;
    var t = ED.lkType || "related";
    ED.lkErr = null;
    if (t === "hyperlink") {
      var u = String(ED.lkUrl || "").trim();
      if (!/^https?:\/\/\S+$/i.test(u)) {
        ED.lkErr = "Enter a full URL starting http:// or https://";
        renderEditor(); return;
      }
      ED.links.push({op: "link", type: t, url: u, comment: String(ED.lkComment || "").trim()});
      ED.lkUrl = "";
    } else {
      var raw = String(ED.lkTarget || "").trim().replace(/^#/, "");
      var n = Number(raw);
      if (!/^\d+$/.test(raw) || !n) {
        ED.lkErr = "Enter the numeric id of the work item to link to.";
        renderEditor(); return;
      }
      if (n === ED.id) {
        ED.lkErr = "A work item cannot be linked to itself.";
        renderEditor(); return;
      }
      var dupe = (RELS[ED.id] || []).some(function (r) {
        return relWiIdOf(r) === n && REL_TO_TYPE[r.rel] === t;
      });
      if (dupe) {
        ED.lkErr = "#" + n + " is already linked to this item as “" + t + "”.";
        renderEditor(); return;
      }
      ED.links.push({op: "link", type: t, toId: n, comment: String(ED.lkComment || "").trim()});
      ED.lkTarget = "";
    }
    ED.lkComment = "";
    renderEditor();
  }
  function queueUnlink(url, type, label) {
    if (!ED || !url || !type) return;
    if (linkQueuedFor(url)) return;
    ED.links.push({op: "unlink", type: type, url: url, label: label || type});
    renderEditor();
  }
  // Applies the queued link operations after the field update has run.
  // A link batch answers 200 with a per-update status inside. Pull out any 4xx/5xx and
  // translate the codes worth translating; anything unrecognised is passed through
  // verbatim rather than guessed at.
  function linkBatchErrors(r) {
    var vals = r && r.value;
    if (!vals) { if (r && r.code >= 400) vals = [r]; else return null; }
    if (!Array.isArray(vals)) vals = [vals];
    var msgs = [];
    vals.forEach(function (v) {
      if (!v || !(v.code >= 400)) return;
      var m = "";
      try {
        var b = typeof v.body === "string" ? JSON.parse(v.body) : v.body;
        m = (b && ((b.value && b.value.Message) || b.Message)) || "";
      } catch (e) {}
      m = adoError(m || ("HTTP " + v.code));
      if (/TF201036/.test(m)) {
        m = "this item already has a Parent. Remove the existing Parent link in the " +
            "same save, then the new one will attach.";
      }
      msgs.push(m);
    });
    return msgs.length ? msgs.join("; ").slice(0, 300) : null;
  }
  function applyLinks(id) {
    if (!ED || !ED.links.length) return Promise.resolve(null);
    var adds = ED.links.filter(function (l) { return l.op === "link"; });
    var rms = ED.links.filter(function (l) { return l.op === "unlink"; });
    var before = (RELS[id] || []).length;
    var failed = [];
    var chain = Promise.resolve();

    // Removals run FIRST. Re-pointing a Parent is unlink-then-link: ADO allows only one
    // Parent, so adding before removing is rejected with TF201036 even though both
    // halves of the change were queued together.
    rms.forEach(function (l) {
      chain = chain.then(function () {
        // The url is ALWAYS sent. The tool's own contract says that without it, every
        // link of the given type is removed — so omitting it could wipe all of an
        // item's Related links instead of the one that was clicked.
        return cmcp("wit_work_item_link_write", {
          action: "unlink", project: CTX.project, id: id, type: l.type, url: l.url
        }).then(function (r) {
          var bad = linkBatchErrors(r);
          if (bad) failed.push("removing " + l.label + ": " + bad);
        }).catch(function (e) {
          failed.push("removing " + l.label + ": " + adoError(e).slice(0, 180));
        });
      });
    });
    if (adds.length) {
      chain = chain.then(function () {
        return cmcp("wit_work_item_link_write", {
          action: "link", project: CTX.project,
          updates: adds.map(function (l) {
            var u = {id: id, type: l.type};
            if (l.type === "hyperlink") u.url = l.url; else u.linkToId = l.toId;
            if (l.comment) u.comment = l.comment;
            return u;
          })
        }).then(function (r) {
          // A rejected link write comes back as HTTP 200 carrying a per-update 400 in
          // its body, so nothing throws. Without this check a failed link would be
          // reported as applied.
          var bad = linkBatchErrors(r);
          if (bad) failed.push("adding links: " + bad);
        }).catch(function (e) {
          failed.push("adding links: " + adoError(e).slice(0, 180));
        });
      });
    }

    return chain.then(function () {
      // Re-read and count. Link writes carry no revision guard, and an unlink that
      // fails to match its url could over-remove, so the result is checked rather
      // than assumed.
      return cmcp("wit_work_item", {action: "get", project: CTX.project, id: id, expand: "All"})
        .then(function (wi) {
          if (wi && wi.relations) RELS[id] = wi.relations;
          if (wi && wi.fields) DETAIL[id] = wi.fields;
          if (wi && typeof wi.rev === "number") ED.rev = wi.rev;
          return {failed: failed, before: before, after: (RELS[id] || []).length,
                  expect: before + adds.length - rms.length};
        })
        .catch(function () {
          return {failed: failed, before: before, after: null, expect: null};
        });
    });
  }

  // ---- drawer rendering --------------------------------------------------
  function fieldRow(sp, type) {
    var v = ED.draft[sp.k] || "";
    var ctl;
    if (sp.kind === "select") {
      var list = sp.opts(type);
      if (v && list.indexOf(v) === -1) list = [v].concat(list);
      ctl = '<select id="ed_' + sp.k + '"' + (sp.short ? ' class="wide"' : "") + ">" +
        // Only hide "not set" when there is already a value. Hiding it on a field that
        // is currently empty would make the select default to the first real option and
        // silently stage a change the user never asked for.
        (isRequired(sp, type) && v ? "" : '<option value="">— not set —</option>') +
        list.map(function (o) {
          return '<option value="' + esc(o) + '"' + (v === o ? " selected" : "") + ">" +
            esc(sp.f === F_ITER ? shortIter(o) : o) + "</option>";
        }).join("") + "</select>";
    } else if (sp.kind === "date") {
      ctl = '<input type="date" id="ed_' + sp.k + '" value="' + esc(v) + '">';
    } else if (sp.kind === "num") {
      ctl = '<input type="number" step="0.5" min="0" id="ed_' + sp.k + '" value="' + esc(v) + '">';
    } else if (sp.kind === "combo") {
      // A combo, not a select: the picklist values are the ones observed on the board,
      // not a schema we can read, so typing a value the list does not carry has to stay
      // possible. If ADO refuses it, its own message is shown verbatim.
      ctl = '<input type="text" id="ed_' + sp.k + '" list="edl_' + sp.k + '" value="' +
        esc(v) + '" class="wide" autocomplete="off">' +
        '<datalist id="edl_' + sp.k + '">' + sp.opts(type).map(function (o) {
          return '<option value="' + esc(o) + '"></option>';
        }).join("") + "</datalist>";
    } else if (sp.kind === "bool") {
      ctl = '<select id="ed_' + sp.k + '">' +
        [["", "— not set —"], ["true", "Yes"], ["false", "No"]].map(function (o) {
          return '<option value="' + o[0] + '"' + (v === o[0] ? " selected" : "") + ">" +
            o[1] + "</option>";
        }).join("") + "</select>";
    } else if (sp.kind === "person") {
      var pl = peopleList();
      ctl = '<input type="text" id="ed_' + sp.k + '" list="ed_people" value="' + esc(v) +
        '" placeholder="name@thomsonreuters.com" class="wide">' +
        '<datalist id="ed_people">' + pl.map(function (p) {
          return '<option value="' + esc(p.email) + '">' + esc(p.name) + "</option>";
        }).join("") + "</datalist>";
    } else {
      ctl = '<input type="text" id="ed_' + sp.k + '" value="' + esc(v) + '"' +
        (sp.wide ? ' class="wide"' : "") + ">";
    }
    var req = isRequired(sp, type);
    return "<label>" + esc(sp.label) +
      (req ? ' <span class="muted" style="font-weight:400;font-size:11px">required</span>' : "") +
      "</label>" + ctl +
      (sp.note || req || sp.kind === "combo"
        ? '<div class="fnote">' +
          (sp.kind === "combo"
            ? "Pick a listed value or type another \u2014 Azure DevOps does not publish " +
              "the allowed list for this field, so these are the values in use on the " +
              "board." + (sp.note || req ? " " : "")
            : "") +
          (req ? "ADO will not accept this empty on a " + esc(type) + "." +
                 (sp.note ? " " : "") : "") +
          (sp.note ? esc(sp.note) : "") + "</div>"
        : "");
  }
  function richBlock(r) {
    var st = ED.rich[r.k];
    var cur = htmlToText(st.orig);
    var sel = function (m, n) {
      return '<option value="' + m + '"' + (st.mode === m ? " selected" : "") + ">" + n + "</option>";
    };
    return "<h2 style=\"margin-top:18px\">" + esc(r.label) + "</h2>" +
      '<div class="readonly">' + (cur ? esc(cur)
        : '<span class="muted">empty \u2014 nothing recorded in ADO yet</span>') + "</div>" +
      '<div class="frow" style="margin-top:10px">' +
        "<label>Change it</label>" +
        '<select id="edm_' + r.k + '">' +
          sel("keep", "Leave unchanged") +
          // On an empty field, append and replace do the same thing, so only one is
          // offered. Two identical choices is just a chance to pick the wrong one.
          (st.empty
            ? sel("replace", "Write the content")
            : sel("append", "Append to the end") + sel("replace", "Replace everything")) +
        "</select>" +
      "</div>" +
      (st.mode === "keep" ? "" :
        '<textarea id="edt_' + r.k + '" placeholder="' +
          (st.mode === "append" ? "Text to add at the end…" : "New content…") + '">' +
          esc(st.text) + "</textarea>" +
        '<div class="warnbox"><b>Plain text only.</b> ADO stores this field as HTML. ' +
          "What you type is converted to simple paragraphs and line breaks. " +
          (st.empty
            ? "This field is empty, so there is no existing formatting to lose."
            : st.mode === "replace"
              ? "Replacing will discard any tables, links, images or formatting in the " +
                "original above."
              : "Appending keeps the original exactly as it is.") + "</div>");
  }
  // ---- @mention engine ---------------------------------------------------
  // ADO builds a mention from an anchor carrying the identity GUID:
  //   <a href="#" data-vss-mention="version:2.0,<guid>">@Display Name</a>
  // Plain "@name" text notifies nobody, so the GUID is mandatory and the comment must
  // be posted as Html rather than Markdown. The picker is fed from PEOPLE (local and
  // instant); the GUID is confirmed through core_get_identity_ids on selection, and the
  // chip shows whether that worked — a tag that cannot be resolved is never silently
  // posted as dead text without saying so.
  function mentionCandidates() {
    return Object.keys(PEOPLE).map(function (k) { return PEOPLE[k]; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function mentionQuery(ta) {
    if (!ta) return null;
    var pos = ta.selectionStart;
    var m = ta.value.slice(0, pos).match(/(?:^|\s)@([^\n@]{0,30})$/);
    if (!m) return null;
    if ((m[1].match(/ /g) || []).length > 1) return null;   // ran on into prose
    return {q: m[1], start: pos - m[1].length - 1};
  }
  function matchPeople(q) {
    var s = String(q || "").trim().toLowerCase();
    var all = mentionCandidates();
    if (!s) return all.slice(0, 8);
    return all.filter(function (p) {
      return p.name.toLowerCase().indexOf(s) !== -1 ||
             p.email.toLowerCase().indexOf(s) !== -1;
    }).slice(0, 8);
  }
  function hideMPop() {
    var el = $("ed_mpop");
    if (el) { el.className = "mpop hide"; el.innerHTML = ""; }
    if (ED) ED.mSel = 0;
  }
  // Written straight into the DOM, never via renderEditor — a full re-render on every
  // keystroke would throw away the caret position in the textarea.
  function showMPop() {
    var ta = $("ed_comment"), el = $("ed_mpop");
    if (!ta || !el || !ED) return;
    var mq = mentionQuery(ta);
    if (!mq) { hideMPop(); return; }
    var list = matchPeople(mq.q);
    var typed = mq.q.trim();
    if (!list.length) {
      el.className = "mpop";
      el.innerHTML =
        (/^[\w.+-]+@[\w.-]+\.\w+$/.test(typed)
          ? '<div class="row" data-mp="' + esc(typed.toLowerCase()) + '" data-mn="' +
            esc(typed) + '"><b>Tag ' + esc(typed) +
            '</b><span class="em">look this up in ADO</span></div>'
          : '<div class="none">Nobody in this roadmap matches. Type a full email ' +
            "address to tag someone else.</div>");
      wireMRows(el);
      return;
    }
    if (ED.mSel >= list.length) ED.mSel = 0;
    el.className = "mpop";
    el.innerHTML = list.map(function (p, i) {
      return '<div class="row' + (i === ED.mSel ? " on" : "") + '" data-mp="' +
        esc(p.email) + '" data-mn="' + esc(p.name) + '"><b>' + esc(p.name) +
        '</b><span class="em">' + esc(p.email) + "</span></div>";
    }).join("");
    wireMRows(el);
  }
  function wireMRows(el) {
    Array.prototype.forEach.call(el.querySelectorAll("[data-mp]"), function (row) {
      row.onmousedown = function (e) {
        e.preventDefault();                 // mousedown + preventDefault keeps focus
        pickMention(row.getAttribute("data-mp"), row.getAttribute("data-mn"));
      };
    });
  }
  function pickMention(email, name) {
    var ta = $("ed_comment");
    if (!ta || !ED) return;
    var mq = mentionQuery(ta);
    if (!mq) return;
    var rec = PEOPLE[email] || (PEOPLE[email] = {email: email, name: name, id: null});
    var token = "@" + rec.name + " ";
    var before = ta.value.slice(0, mq.start);
    var after = ta.value.slice(ta.selectionStart);
    ta.value = before + token + after;
    var caret = (before + token).length;
    ta.setSelectionRange(caret, caret);
    ED.comment = ta.value;
    if (!ED.mentions.some(function (x) { return x.email === email; })) {
      var m = {email: email, name: rec.name, id: rec.id || null, busy: false, err: null};
      ED.mentions.push(m);
      if (!m.id) resolveMention(m);
    }
    hideMPop();
    renderMChips();
    ta.focus();
  }
  function resolveMention(m) {
    m.busy = true; m.err = null;
    renderMChips();
    cmcp("core_get_identity_ids", {searchFilter: m.email})
      .then(function (arr) {
        var hit = (Array.isArray(arr) ? arr : [])[0];
        m.busy = false;
        if (hit && hit.id) {
          m.id = hit.id;
          if (PEOPLE[m.email]) PEOPLE[m.email].id = hit.id;
        } else {
          m.err = "no ADO identity";
        }
        renderMChips();
      })
      .catch(function (e) {
        m.busy = false;
        m.err = adoError(e).slice(0, 60) || "lookup failed";
        renderMChips();
      });
  }
  function renderMChips() {
    var el = $("ed_mchips");
    if (!el || !ED) return;
    el.innerHTML = ED.mentions.map(function (m, i) {
      var cls = m.busy ? "" : (m.id ? "ok" : "bad");
      var note = m.busy ? " · checking…"
        : (m.id ? "" : " · " + (m.err || "unresolved"));
      return '<span class="mchip ' + cls + '">@' + esc(m.name) + esc(note) +
        '<button data-mrm="' + i + '" title="Remove this tag">×</button></span>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll("[data-mrm]"), function (b) {
      b.onclick = function () {
        ED.mentions.splice(Number(b.getAttribute("data-mrm")), 1);
        renderMChips();
      };
    });
  }
  function mentionKey(e) {
    var el = $("ed_mpop");
    if (!el || el.className.indexOf("hide") !== -1) return;
    var rows = el.querySelectorAll("[data-mp]");
    if (!rows.length) { if (e.key === "Escape") hideMPop(); return; }
    if (e.key === "ArrowDown") {
      e.preventDefault(); ED.mSel = (ED.mSel + 1) % rows.length; showMPop();
    } else if (e.key === "ArrowUp") {
      e.preventDefault(); ED.mSel = (ED.mSel - 1 + rows.length) % rows.length; showMPop();
    } else if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      var r = rows[ED.mSel] || rows[0];
      pickMention(r.getAttribute("data-mp"), r.getAttribute("data-mn"));
    } else if (e.key === "Escape") {
      e.preventDefault(); hideMPop();
    }
  }
  // Only tags whose literal text is still in the comment get posted — if she deletes
  // the "@Name" the tag goes with it rather than notifying someone invisibly.
  function liveMentions() {
    if (!ED) return [];
    return ED.mentions.filter(function (m) {
      return ED.comment.indexOf("@" + m.name) !== -1;
    });
  }
  // Longest names first: replacing "@Priya" before "@Priya Menon" would corrupt the
  // longer one.
  function commentHtml(text, tags) {
    var out = esc(text);
    tags.slice().sort(function (a, b) { return b.name.length - a.name.length; })
      .forEach(function (m) {
        out = out.split(esc("@" + m.name)).join(
          '<a href="#" data-vss-mention="version:2.0,' + esc(m.id) + '">' +
          esc("@" + m.name) + "</a>");
      });
    return "<div>" + out.replace(/\r?\n/g, "<br>") + "</div>";
  }

  function discBlock() {
    var body = "";
    if (ED.comments === null) {
      body = '<div class="spin">Loading the discussion…</div>';
    } else if (ED.cmtErr) {
      body = '<div class="warnbox">Could not load existing comments: ' + esc(ED.cmtErr) + "</div>";
    } else if (!ED.comments.length) {
      body = '<div class="empty">No comments on this item yet.</div>';
    } else {
      body = ED.comments.map(function (c) {
        var who = (c.createdBy && c.createdBy.displayName) || "someone";
        var when = c.createdDate ? new Date(c.createdDate).toLocaleString(undefined,
          {month:"short", day:"numeric", year:"2-digit", hour:"numeric", minute:"2-digit"}) : "";
        var fmt = c.format === 1 || /<[a-z][\s\S]*>/i.test(String(c.text || ""));
        return '<div class="cmt"><div class="who"><b>' + esc(person(who)) + "</b> &middot; " +
          esc(when) + "</div>" +
          (fmt ? '<div class="rich" style="border:0;padding:0;max-height:none">' +
                   safeHtml(c.text) + "</div>"
               : '<div class="txt">' + esc(c.text) + "</div>") + "</div>";
      }).join("");
    }
    return "<h2>Discussion</h2>" + body +
      "<h2 style=\"margin-top:18px\">Add a comment</h2>" +
      '<div class="mwrap">' +
        '<textarea id="ed_comment" placeholder="Type @ to tag someone. ' +
          'e.g. @Gokhale, Soham (TR Product) can you confirm the new date?">' +
          esc(ED.comment) + "</textarea>" +
        '<div class="mpop hide" id="ed_mpop"></div>' +
      "</div>" +
      '<div class="mchips" id="ed_mchips"></div>' +
      '<div class="hint">Type <b>@</b> to tag someone. The list is everyone who appears ' +
        "anywhere in this roadmap; for anyone else, type their full email address and " +
        "pick it. A tag only notifies the person once its chip turns green — ADO " +
        "needs their identity, not just their name, so an unresolved tag posts as " +
        "ordinary text and reaches nobody. Posted to the work item’s Discussion " +
        "under your account.</div>";
  }

  function reviewBody() {
    var changes = pendingChanges();
    var comment = ED.comment.trim();
    var items = changes.map(function (c) {
      if (c.kind === "rich") {
        return "<li><b>" + esc(c.label) + "</b> &mdash; " + esc(c.wasTxt) +
          "<pre>" + esc(c.preview.slice(0, 900)) +
          (c.preview.length > 900 ? "\n…" : "") + "</pre></li>";
      }
      if (c.kind === "link") {
        var l = c.link;
        if (l.op === "unlink") {
          return "<li><b>Remove link</b> — " + esc(l.label) +
            ' <span class="muted">(' + esc(l.type) + ")</span></li>";
        }
        return "<li><b>Add link</b> — " + esc(l.type) + " to " +
          esc(l.url ? l.url : "#" + l.toId) +
          (l.comment ? ' <span class="muted">“' + esc(l.comment) + "”</span>" : "") +
          "</li>";
      }
      return "<li>" + esc(c.label) + ': <span class="was">' + esc(c.wasTxt) +
        '</span> &rarr; <span class="now">' + esc(c.nowTxt) + "</span></li>";
    });
    if (comment) {
      var live = liveMentions();
      var ok = live.filter(function (m) { return m.id; });
      var bad = live.filter(function (m) { return !m.id; });
      items.push("<li>Add a comment:<pre>" + esc(comment.slice(0, 600)) +
        (comment.length > 600 ? "\n…" : "") + "</pre>" +
        (ok.length ? '<div style="margin-top:5px">Notifies <b>' +
          esc(ok.map(function (m) { return m.name; }).join(", ")) + "</b>.</div>" : "") +
        (bad.length ? '<div style="margin-top:5px;color:#D64000">' +
          esc(bad.map(function (m) { return "@" + m.name; }).join(", ")) +
          (bad.length === 1 ? " could not be resolved to an ADO identity and will post " +
            "as plain text — it will notify nobody."
           : " could not be resolved to ADO identities and will post as plain text — " +
             "they will notify nobody.") + "</div>" : "") +
        "</li>");
    }
    return '<div class="diff"><b>About to write to Azure DevOps</b> &mdash; ' +
      esc(String(fl(ED.id, "System.WorkItemType"))) + " #" + ED.id +
      "<ul>" + items.join("") + "</ul></div>" +
      '<div class="hint">This runs as you, and touches nothing on the item beyond the lines above.' +
      (ED.rev != null
        ? " The save is guarded against a revision check (rev " + ED.rev +
          "), so if someone has edited this item since you opened it the whole write is " +
          "rejected rather than applied over the top of their change."
        : " <b>No revision check is possible</b> because the full item could not be loaded — " +
          "a concurrent edit by someone else would be overwritten.") +
      (changes.some(function (c) { return c.kind === "link"; })
        ? " Link changes are applied as a separate call and are <b>not</b> covered by that " +
          "revision check; the link count is re-read afterwards and any discrepancy reported."
        : "") + "</div>";
  }

  function renderEditor() {
    if (!ED) return;
    var id = ED.id;
    var type = String(fl(id, "System.WorkItemType") || "");
    var title = String(fl(id, F_TITLE) || "");
    var changes = ED.loading ? [] : pendingChanges();
    var comment = ED.comment.trim();
    var nothing = !changes.length && !comment;
    var dirty = dirtySects();

    var body, snav = "";
    if (ED.stage === "review") {
      body = reviewBody();
    } else {
      snav = '<div class="snav">' + CTX.sects().map(function (s) {
        return '<button data-sect="' + s.k + '" class="' + (ED.sect === s.k ? "on" : "") + '">' +
          s.n + (dirty[s.k] ? ' <span class="dirty">&bull;</span>' : "") + "</button>";
      }).join("") + "</div>";

      if (ED.loading) {
        body = '<div class="spin">Loading #' + id + " from Azure DevOps…</div>";
      } else if (ED.sect === "details") {
        body = (ED.err ? '<div class="warnbox">' + esc(ED.err) + "</div>" : "") + detailsBlock(id);
      } else if (ED.sect === "history") {
        if (REVS[id] === undefined) loadRevisions(id, ED.rev);
        body = historyBlock(id);
      } else if (ED.sect === "disc") {
        body = discBlock();
      } else {
        var mine = cspec().filter(function (sp) { return sp.s === ED.sect; });
        body = (ED.err ? '<div class="warnbox">' + esc(ED.err) + "</div>" : "") +
          '<div class="frow">' + mine.map(function (sp) { return fieldRow(sp, type); }).join("") +
          "</div>";
        if (ED.sect === "text") {
          body += crich().map(richBlock).join("");
        }
        if (ED.sect === "core") {
          body += '<div class="hint">Leave a field as it is to skip it. ' +
            "Clearing a date or an owner removes it in ADO.</div>";
        }
      }
    }

    $("ov").innerHTML =
      '<div class="box"><div class="hd">' +
        (NAV.length ? '<button class="back" id="eNavBack">&larr; back to #' +
          NAV[NAV.length - 1] + "</button>" : "") +
        '<span class="pill p-type">' + esc(type || "…") + "</span> " +
        (fl(id, F_STATE) ? statePill(id) + " " : "") +
        '<span class="muted" style="font-size:12px">#' + id + "</span>" +
        (ED.rev != null ? '<span class="muted" style="font-size:11.5px"> &middot; rev ' + ED.rev + "</span>" : "") +
        ' &middot; <a href="' + cUrl(id) + '" target="_blank" style="font-size:11.5px">open in ADO &nearr;</a>' +
        '<div class="t">' + esc(title || "Loading…") + "</div>" +
      "</div>" + snav +
      '<div class="bd">' + body + "</div>" +
      '<div class="ft">' +
        (ED.msg ? '<span class="msg ' + (ED.msg.ok ? "ok" : "bad") + '">' + esc(ED.msg.text) + "</span>" : "") +
        (ED.loading
          ? '<button class="btn" id="eCancel">Close</button>'
          : ED.stage === "review"
            ? '<button class="btn" id="eBack">Back</button>' +
              '<button class="btn pri" id="eSave"' + (ED.busy ? " disabled" : "") + ">" +
              (ED.busy ? "Saving…" : "Save to ADO") + "</button>"
            : '<button class="btn" id="eCancel">Cancel</button>' +
              '<button class="btn pri" id="eReview"' + (nothing ? " disabled" : "") + ">Review " +
              (changes.length + (comment ? 1 : 0) || "") + " change" +
              ((changes.length + (comment ? 1 : 0)) === 1 ? "" : "s") + "</button>") +
      "</div></div>";
    $("ov").classList.remove("hide");
    wireEditor(type);
  }

  // Typing in a textarea must not trigger renderEditor — that would rebuild the DOM and
  // throw away the caret. But the footer's Review button is rendered disabled when the
  // drawer opens (nothing has changed yet), so without this it stayed disabled no matter
  // what was typed, and there was no way to reach Save at all. This updates just the
  // button in place: enabled state and label, nothing else touched.
  function refreshFooter() {
    if (!ED || ED.stage !== "form" || ED.loading) return;
    var btn = $("eReview");
    if (!btn) return;
    var n = pendingChanges().length + (ED.comment.trim() ? 1 : 0);
    btn.disabled = n === 0;
    btn.textContent = "Review " + (n || "") + " change" + (n === 1 ? "" : "s");
    // Keep the section dots honest too — they are plain markup with no inputs in them.
    var nav = document.querySelector("#ov .snav");
    if (nav) {
      var dirty = dirtySects();
      Array.prototype.forEach.call(nav.querySelectorAll("[data-sect]"), function (b) {
        var k = b.getAttribute("data-sect");
        var dot = b.querySelector(".dirty");
        if (dirty[k] && !dot) {
          b.insertAdjacentHTML("beforeend", ' <span class="dirty">•</span>');
        } else if (!dirty[k] && dot) {
          dot.parentNode.removeChild(dot);
        }
      });
    }
  }

  function readForm() {
    if (!ED || ED.stage !== "form" || ED.loading) return;
    cspec().forEach(function (sp) {
      var el = $("ed_" + sp.k);
      if (el) ED.draft[sp.k] = String(el.value || "").trim();
    });
    crich().forEach(function (r) {
      var m = $("edm_" + r.k), t = $("edt_" + r.k);
      if (m) ED.rich[r.k].mode = m.value;
      if (t) ED.rich[r.k].text = t.value;
    });
    var c = $("ed_comment");
    if (c) ED.comment = c.value;
  }
  function wireEditor(type) {
    var ov = $("ov");
    ov.onclick = function (e) { if (e.target === ov) closeEditor(); };

    // Follow a link to another work item without leaving the dashboard.
    Array.prototype.forEach.call(ov.querySelectorAll("[data-nav]"), function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var to = Number(b.getAttribute("data-nav"));
        var from = ED ? ED.id : null;
        if (ED && pendingChanges().length) {
          if (!window.confirm("You have unsaved edits on #" + from +
              ". Leave them and open #" + to + "?")) return;
        }
        if (from) NAV.push(from);
        openEditor(to, "details", true, null, CTX);
      };
    });
    if ($("eNavBack")) $("eNavBack").onclick = function () {
      var back = NAV.pop();
      if (back) openEditor(back, "details", true, null, CTX);
    };

    Array.prototype.forEach.call(ov.querySelectorAll("[data-sect]"), function (b) {
      b.onclick = function () {
        readForm();
        ED.sect = b.getAttribute("data-sect");
        renderEditor();
      };
    });
    // Re-render on a fresh task, not inside the change/blur event — replacing the
    // dialog's DOM mid-blur throws "node to be removed is no longer a child".
    cspec().forEach(function (sp) {
      var el = $("ed_" + sp.k);
      if (!el) return;
      var rerender = function () {
        readForm();
        setTimeout(function () { if (ED) renderEditor(); }, 0);
      };
      if (sp.kind === "text" || sp.kind === "person" || sp.kind === "num") {
        // No re-render while typing, but the footer has to keep up.
        el.oninput = function () { readForm(); refreshFooter(); };
        el.onchange = rerender;
      } else {
        el.onchange = rerender;
      }
    });
    crich().forEach(function (r) {
      var m = $("edm_" + r.k);
      if (m) m.onchange = function () {
        readForm();
        setTimeout(function () { if (ED) renderEditor(); }, 0);
      };
      var t = $("edt_" + r.k);
      if (t) t.oninput = function () { ED.rich[r.k].text = t.value; refreshFooter(); };
    });
    var c = $("ed_comment");
    if (c) {
      c.oninput = function () { ED.comment = c.value; showMPop(); refreshFooter(); };
      c.onkeydown = mentionKey;
      c.onclick = function () { showMPop(); };
      // Delay so a click on a picker row registers before the popover disappears.
      c.onblur = function () { setTimeout(hideMPop, 150); };
      renderMChips();
    }

    // Link controls in the Details section.
    if ($("lkType")) $("lkType").onchange = function () {
      ED.lkType = $("lkType").value; ED.lkErr = null; renderEditor();
    };
    ["lkTarget", "lkUrl", "lkComment"].forEach(function (k) {
      var el = $(k);
      if (el) el.oninput = function () { ED[k] = el.value; };
    });
    if ($("lkAdd")) $("lkAdd").onclick = function () { queueLink(); };
    Array.prototype.forEach.call(ov.querySelectorAll("[data-unlink]"), function (b) {
      b.onclick = function () {
        queueUnlink(b.getAttribute("data-unlink"), b.getAttribute("data-unlinktype"),
                    b.getAttribute("data-unlinklabel"));
      };
    });
    Array.prototype.forEach.call(ov.querySelectorAll("[data-lkrm]"), function (b) {
      b.onclick = function () {
        ED.links.splice(Number(b.getAttribute("data-lkrm")), 1);
        renderEditor();
      };
    });

    if ($("eCancel")) $("eCancel").onclick = closeEditor;
    if ($("eReview")) $("eReview").onclick = function () {
      readForm();
      if (!validate()) return;
      ED.stage = "review"; ED.msg = null; renderEditor();
    };
    if ($("eBack")) $("eBack").onclick = function () { ED.stage = "form"; ED.msg = null; renderEditor(); };
    if ($("eSave")) $("eSave").onclick = saveEditor;
  }
  function validate() {
    var type = String(fl(ED.id, "System.WorkItemType") || "");
    var bad = [];
    cspec().forEach(function (sp) {
      if (!isRequired(sp, type)) return;
      // Block only the act of EMPTYING a required field. Plenty of items sit in ADO
      // with a required field already blank; refusing to save an unrelated edit on
      // those would be the tracker inventing a rule ADO is not applying.
      var was = (ED.orig[sp.k] || "").trim();
      var now = (ED.draft[sp.k] || "").trim();
      if (was && !now) bad.push(sp.label);
    });
    if (bad.length) {
      ED.msg = {ok: false, text: (bad.length === 1 ? "“" + bad[0] + "” is" :
        "These are") + " required on a " + type + " in ADO" +
        (bad.length === 1 ? "" : ": " + bad.join(", ")) +
        ", so " + (bad.length === 1 ? "it" : "they") + " cannot be left empty. " +
        "Set a value, or press Back and leave the field alone."};
      renderEditor();
      return false;
    }
    return true;
  }

  function saveEditor() {
    if (!ED || ED.busy) return;
    var id = ED.id;
    var changes = pendingChanges();
    var comment = ED.comment.trim();
    var nLinks = ED.links.length;
    var lkNote = null;
    ED.busy = true; ED.msg = null; renderEditor();

    // Optimistic concurrency: ADO rejects the whole patch if rev has moved on.
    var updates = [];
    if (ED.rev != null) updates.push({op: "test", path: "/rev", value: ED.rev});
    changes.forEach(function (c) {
      if (c.kind === "link") return;          // links go through their own API
      // Clearing a field: ADO's JSON-patch "remove" needs value:null, which the MCP
      // wrapper will not pass through. "replace" with "" satisfies both.
      var val = c.kind === "rich" ? c.adoBody : adoValue(c.spec, c.now);
      updates.push({op: "replace", path: c.path, value: val});
    });

    var wrote = updates.length > (ED.rev != null ? 1 : 0);
    var step = wrote
      ? cmcp("wit_work_item_write", {action: "update", project: CTX.project, id: id, updates: updates})
      : Promise.resolve(null);

    var stuck = [];
    step.then(function (res) {
      // Trust ADO's response over our own optimism: rebuild local state from it,
      // then check every intended change actually landed.
      if (res && res.fields) {
        DETAIL[id] = DETAIL[id] || {};
        Object.keys(res.fields).forEach(function (k) { DETAIL[id][k] = res.fields[k]; });
        // Only refresh M for items the roadmap query actually owns, so an item opened
        // through a relation never appears in the counts.
        if (CTX.syncModel && M[id]) {
          Object.keys(res.fields).forEach(function (k) { M[id].fields[k] = res.fields[k]; });
        }
        // A support ticket lives on its own tab, so refresh that row in place rather
        // than leaving the list showing the pre-save state.
        if (CTX.key === "support") supSync(id, res.fields);
        if (res.relations) RELS[id] = res.relations;
        delete REVS[id];                       // history is now stale
        if (typeof res.rev === "number") ED.rev = res.rev;
        changes.forEach(function (c) {
          // HTML is normalised by ADO so cannot be diffed; links are not fields.
          if (c.kind === "rich" || c.kind === "link") return;
          var name = c.path.replace("/fields/", "");
          if (!sameFieldValue(c.spec, normFor(c.spec, res.fields[name]), c.now || "")) {
            stuck.push(c.label);
          }
        });
      }
      return applyLinks(id);
    }).then(function (note) {
      lkNote = note;
      if (!comment) return null;
      // Only switch to Html when there is a resolved tag to embed — plain comments stay
      // Markdown, which is what the rest of the Discussion thread uses.
      var tags = liveMentions().filter(function (m) { return m.id; });
      return cmcp("wit_work_item_comment_write", {
        action: "add", project: CTX.project, workItemId: id,
        text: tags.length ? commentHtml(comment, tags) : comment,
        format: tags.length ? "Html" : "Markdown"
      });
    }).then(function () {
      ED.busy = false;
      var problems = stuck.length
        ? ["ADO accepted the request but did not change: " + stuck.join(", ")] : [];
      if (lkNote && lkNote.failed.length) problems = problems.concat(lkNote.failed);
      // A mismatch here means the link write did something other than asked — most
      // likely an unlink that could not match its url. Never let that pass silently.
      var countWarn = (lkNote && lkNote.after != null && lkNote.expect != null &&
                       lkNote.after !== lkNote.expect)
        ? " Links went from " + lkNote.before + " to " + lkNote.after + " when " +
          lkNote.expect + " was expected — check Related work before relying on it."
        : "";
      ED.msg = (problems.length || countWarn)
        ? {ok: false, text: (problems.join(" · ") || "Saved.") + countWarn}
        : {ok: true, text: "Saved to ADO" + (comment ? " with your comment" : "") +
             (nLinks ? " and " + nLinks + " link change" + (nLinks === 1 ? "" : "s") : "") + "."};
      ED.comment = "";
      ED.mentions = [];
      ED.links = [];
      ED.lkErr = null;
      seedDraft();                                   // originals are now the saved values
      ED.stage = "form";
      if (comment) { ED.comments = null; loadComments(id); }
      renderEditor();
      stats = EPICS.map(epicStats);
      setTimeout(function () { show(active); }, 0);
      if (!stuck.length) setTimeout(function () { if (ED && ED.id === id) closeEditor(); }, 1600);
    }).catch(function (err) {
      console.error("ADO write failed", err);
      var raw = adoError(err);
      var type = String(fl(id, "System.WorkItemType") || "work item");
      ED.busy = false;
      // ADO rejects the patch as a whole, so in every branch below nothing was written.
      var rule = raw.match(/Rule Error for field ([\w.]+)\s*\.?\s*Error code:\s*([A-Za-z0-9, ]+)/i);
      var msg;
      if (/VS403351|precondition|revision|concurren/i.test(raw) || /\/rev/.test(raw)) {
        msg = "Someone else changed #" + id + " since you opened it, so nothing was written. " +
              "Close and reopen to pick up their edit, then reapply yours.";
      } else if (rule && /Required|InvalidEmpty/i.test(rule[2])) {
        var sp = specFor(rule[1]);
        if (sp) REQ[reqKey(type, sp.f)] = true;       // don't offer this dead end again
        msg = "“" + fieldLabel(rule[1]) + "” is a required field on a " + type +
              " in your ADO process, so it cannot be emptied — only changed to another " +
              "value. Nothing was written. Press Back; the field is now marked required.";
      } else if (rule) {
        msg = "ADO’s rules rejected the change to “" + fieldLabel(rule[1]) +
              "” (" + rule[2].trim() + "). Nothing was written.";
      } else {
        msg = "ADO rejected it, and nothing was written: " + raw;
      }
      ED.msg = {ok: false, text: msg};
      renderEditor();
    });
  }

  // ============ tabs =====================================================
  var TABS = [
    {k:"overview", n:"Overview"},
    {k:"epics",    n:"Epics"},
    {k:"tree",     n:"Drill-down"},
    {k:"bugs",     n:"Bugs"},
    {k:"risks",    n:"Risks and blockers"},
    {k:"support",  n:"My Support Tickets"}
  ];
  var charts = {}, stats = [], active = "overview";

  function kpi(n, l, cls, sub) {
    return '<div class="kpi ' + (cls || "") + '"><div class="n">' + n +
      '</div><div class="l">' + esc(l) + "</div>" +
      (sub ? '<div class="s">' + esc(sub) + "</div>" : "") + "</div>";
  }

  // ---- schedule triage ---------------------------------------------------
  // A breach 90+ days old is not a slipping plan — it is work nobody has closed,
  // re-baselined or dropped. Reporting the two together makes every number look
  // equally alarming and buries the handful a nudge this week would actually fix.
  var DECIDE_DAYS = 90;
  function breached(id) { return daysLate(id) != null; }
  function needsDecision(id) { var d = daysLate(id); return d != null && d >= DECIDE_DAYS; }
  function whyLate(id) {
    return isOverdue(id) ? "past target date" : (isLateStart(id) ? "past start, not begun" : "");
  }
  function approaching(id) {
    var t = tgt(id);
    if (!t || breached(id)) return false;
    var d = days(NOW, t);
    return d >= 0 && d <= 14;
  }
  function openEF() {
    return Object.keys(M).map(Number).filter(function (id) {
      return isEpicOrFeature(id) && isOpen(id);
    });
  }
  var byLateDesc = function (a, b) { return (daysLate(b) || 0) - (daysLate(a) || 0); };
  function triage(scope) {
    var ef = (scope || openEF()).filter(function (id) {
      return isEpicOrFeature(id) && isOpen(id);
    });
    return {
      ef: ef,
      decide: ef.filter(needsDecision).sort(byLateDesc),
      slip: ef.filter(function (id) { return breached(id) && !needsDecision(id); }).sort(byLateDesc),
      soon: ef.filter(approaching).sort(function (a, b) { return tgt(a) - tgt(b); }),
      nodate: ef.filter(function (id) { return missingDates(id).length > 0; })
    };
  }
  function triLine(id) {
    var d = daysLate(id);
    var t = String(fl(id, F_TITLE) || "");
    var own = person(fl(id, F_ASSIGN));
    var when = d != null ? d + "d" : (tgt(id) ? "in " + days(NOW, tgt(id)) + "d" : "—");
    return '<div class="tline">' +
      '<span class="age">' + when + "</span>" +
      '<span><button class="idbtn" data-open="' + id + '">' + id + "</button> " +
        '<span class="pill p-type">' + esc(fl(id, "System.WorkItemType")) + "</span> " +
        '<span class="ti">' + esc(t.length > 76 ? t.slice(0, 75) + "…" : t) + "</span>" +
        '<div class="who">' +
          esc(whyLate(id) || (tgt(id) ? "target " + fmtDate(tgt(id)) : "no start or target date")) +
          (fl(id, F_ITER) ? " · " + esc(shortIter(fl(id, F_ITER))) : "") + "</div></span>" +
      '<span class="who">' + (own ? esc(own) : "unassigned") + "</span>" +
      '<span class="act"><button class="edit" data-edit="' + id + '">Manage</button></span>' +
      "</div>";
  }
  // `title` is the full heading, phrased as the action to take — not a bare label with
  // a count bolted on. "Decide what happens to 6 items" tells you what to do;
  // "6 need a decision" makes you work that out for yourself.
  function triGroup(title, desc, ids, urgent, cap, where) {
    if (!ids.length) return "";
    cap = cap || 6;
    return '<div class="tri' + (urgent ? " urgent" : "") + '">' +
      '<div class="th"><div class="n">' + esc(title) + "</div>" +
      '<div class="d">' + esc(desc) + "</div></div>" +
      '<div class="body">' + ids.slice(0, cap).map(triLine).join("") +
      (ids.length > cap ? '<div class="more">' + (ids.length - cap) + " more" +
        (where ? " — see <b>" + where + "</b>" : "") + ".</div>" : "") +
      "</div></div>";
  }

  // ---- Overview ----------------------------------------------------------
  // Deliberately just a to-do list. No percentages, no charts, no PM vocabulary —
  // the reporting view lives in the health strip above, and the analysis lives on
  // Risks. Each heading is the action; each row is the thing to act on and who owns it.
  function paneOverview() {
    var T = triage();
    var one = function (k) { return T[k].length === 1; };
    var blocks = "";

    blocks += triGroup(
      "Decide what happens to " + T.decide.length + " item" + (one("decide") ? "" : "s"),
      "Late by months. Close " + (one("decide") ? "it" : "them") + ", set a new date, or drop " +
      (one("decide") ? "it" : "them") + ". Chasing an owner will not move these.",
      T.decide, true, 6, "Risks and blockers");

    blocks += triGroup(
      "Chase " + T.slip.length + " item" + (one("slip") ? "" : "s") + " running late",
      "Slipped in the last " + DECIDE_DAYS + " days. An owner can still pull " +
      (one("slip") ? "it" : "these") + " back.",
      T.slip, true, 6, "Risks and blockers");

    blocks += triGroup(
      T.soon.length + " item" + (one("soon") ? " is" : "s are") + " due in the next two weeks",
      "On time so far. Worth checking " + (one("soon") ? "it lands" : "they will land") + ".",
      T.soon, false, 5, "Risks and blockers");

    blocks += triGroup(
      T.nodate.length + " item" + (one("nodate") ? " has" : "s have") + " no dates at all",
      "With no start or target date, " + (one("nodate") ? "it can" : "these can") +
      " never show up as late.",
      T.nodate, false, 5, "Risks and blockers");

    return '<h2 style="margin-top:0">What needs you</h2>' +
      (blocks ||
        '<div class="empty">Nothing is late, nothing is due in the next two weeks, and every ' +
        "item has dates. Nothing needs you here today.</div>");
  }

  // ---- Epics -------------------------------------------------------------
  function epicCard(s) {
    var flags = [];
    if (s.selfOverdue) flags.push('<span class="flag red">Epic ' + s.selfLate + "d past target</span>");
    if (s.selfLateStart) flags.push('<span class="flag red">Epic ' + s.selfLate + "d past start</span>");
    if (s.overdue) flags.push('<span class="flag red">' + s.overdue + " children overdue</span>");
    if (s.lateStart) flags.push('<span class="flag">' + s.lateStart + " past start date</span>");
    if (s.stale) flags.push('<span class="flag">' + s.stale + " stale</span>");
    if (s.openBugs) flags.push('<span class="flag">' + s.openBugs + " open bugs</span>");
    if (!flags.length) flags.push('<span class="flag ok">on track</span>');
    var b = s.st;
    return '<div class="epic"><div class="top"><div>' +
      '<div class="nm"><button class="idbtn" data-open="' + s.id +
        '" style="font-size:14px;font-weight:500;color:var(--tr-racing-green)">' +
        esc(fl(s.id, F_TITLE)) + "</button></div>" +
      '<div class="meta">#' + s.id + " &middot; " + esc(fl(s.id, F_STATE)) +
        " &middot; " + esc(shortIter(fl(s.id, F_ITER))) +
        (stt(s.id) ? " &middot; start " + fmtDate(stt(s.id)) : "") +
        (tgt(s.id) ? " &middot; target " + fmtDate(tgt(s.id)) : " &middot; no target date") +
        (fl(s.id, F_PI) ? " &middot; cust. release " + fmtDate(fl(s.id, F_PI)) : "") +
      "</div></div>" +
      '<div><div class="pct">' + s.pct + '%</div><div class="pctl">' +
        (s.ptsTotal > 0 ? s.ptsDone + "/" + s.ptsTotal + " pts" : "complete") + "</div></div></div>" +
      '<div class="bar ' + (s.pct >= 80 ? "ok" : (s.overdue || s.selfOverdue ? "risk" : "")) +
        '"><i style="width:' + s.pct + '%"></i></div>' +
      '<div class="brk">' +
        "<span><b>" + s.feat.total + "</b> features</span>" +
        "<span><b>" + s.story.total + "</b> stories</span>" +
        "<span><b>" + s.bug.total + "</b> bugs" + (s.openBugs ? " (" + s.openBugs + " open)" : "") + "</span>" +
        '<span class="pill p-done">' + b.done + " done</span>" +
        '<span class="pill p-prog">' + b.prog + " in progress</span>" +
        '<span class="pill p-new">' + b["new"] + " not started</span>" +
        (b.blocked ? '<span class="pill p-blk">' + b.blocked + " blocked</span>" : "") +
        '<span style="margin-left:auto;display:flex;gap:10px;align-items:center">' +
          '<button class="edit" data-edit="' + s.id + '">Manage</button>' +
          '<button class="lnk drillin" data-id="' + s.id + '">Drill in &rarr;</button></span>' +
      "</div>" +
      '<div class="flags">' + flags.join("") + "</div></div>";
  }
  function paneEpics() {
    return stats.map(epicCard).join("") ||
      '<div class="empty">No Epics returned by the query.</div>';
  }

  // ---- Drill-down --------------------------------------------------------
  // ---- follow-up notes -----------------------------------------------------
  // Board-only. These never touch Azure DevOps unless explicitly posted, which routes
  // through the drawer's normal confirm-then-write path rather than writing from here.
  // Stored in this browser's localStorage: instant and dependency-free, but tied to
  // this machine and this browser profile — hence Export/Import as the safety net.
  var NOTES_KEY = "adoTrackerNotes.v1";
  var NOTES = {};
  var NOTES_ON = true;
  var NOTE_EDIT = null;        // {id, idx (null = new), text}
  function loadNotes() {
    try {
      var raw = localStorage.getItem(NOTES_KEY);
      NOTES = raw ? JSON.parse(raw) : {};
      if (!NOTES || typeof NOTES !== "object") NOTES = {};
    } catch (e) { NOTES = {}; }
  }
  function saveNotes() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); }
    catch (e) { console.error("Could not save notes", e); }
  }
  function notesFor(id) { return NOTES[String(id)] || []; }
  function openNoteCount() {
    var n = 0;
    Object.keys(NOTES).forEach(function (k) {
      (NOTES[k] || []).forEach(function (x) { if (!x.done) n++; });
    });
    return n;
  }
  function notedIds() {
    return Object.keys(NOTES).filter(function (k) { return (NOTES[k] || []).length; });
  }

  var EXPAND = {};
  var FILTER = {epics:[], feats:[], iter:"", types:[], states:[], owner:"", q:"",
                reldate:"", notesOnly:false};
  var BLANK_FILTER = JSON.parse(JSON.stringify(FILTER));
  function blankFilter() { return JSON.parse(JSON.stringify(BLANK_FILTER)); }
  var STATE_OPEN = false;
  var TYPE_OPEN = false;
  var EPIC_OPEN = false;
  var FEAT_OPEN = false;
  // Selected Epics, or all of them when none are ticked — the set the Feature list and
  // every scope calculation start from.
  function activeEpics() {
    var sel = FILTER.epics.filter(function (e) { return M[e]; }).map(Number);
    return sel.length ? sel : EPICS.slice();
  }
  function activeFeats() { return FILTER.feats.filter(function (f) { return M[f]; }).map(Number); }
  function featsForEpics() {
    var out = [];
    activeEpics().forEach(function (e) {
      featuresOf(e).forEach(function (f) { if (out.indexOf(f) === -1) out.push(f); });
    });
    return out;
  }
  // Feature beats Epic: ticking Features means "these, wherever they live".
  function filterRoots() {
    var f = activeFeats();
    if (f.length) return f;
    return activeEpics();
  }
  var _sm = {};
  // Drives whether the tree auto-expands. Any filter that can match something deep
  // has to be in here, or its matches sit hidden inside collapsed parents.
  function filtersActive() {
    return !!(FILTER.states.length || FILTER.types.length || FILTER.owner ||
              FILTER.q || FILTER.iter || FILTER.reldate);
  }
  // Every filter that is currently doing something, for the per-filter x buttons and
  // the count on Clear all.
  function activeFilters() {
    var a = [];
    if (FILTER.epics.length) a.push("epic");
    if (FILTER.feats.length) a.push("feature");
    if (FILTER.types.length) a.push("types");
    if (FILTER.states.length) a.push("states");
    if (FILTER.owner) a.push("owner");
    if (FILTER.q) a.push("q");
    if (FILTER.notesOnly) a.push("notesOnly");
    if (FILTER.iter) a.push("iter");
    if (FILTER.reldate) a.push("reldate");
    return a;
  }
  // Narrowing the Epic/Feature scope can strip a value another filter is holding —
  // a type, an iteration or a release date the new scope simply does not contain.
  // Left in place they would silently empty the table, so they are dropped.
  function dropOutOfScopeFilters(epicChanged) {
    if (epicChanged) {
      var keep = featsForEpics().map(String);
      FILTER.feats = FILTER.feats.filter(function (f) { return keep.indexOf(f) !== -1; });
    }
    var avail = typeCounts().map(function (o) { return o.name; });
    FILTER.types = FILTER.types.filter(function (t) { return avail.indexOf(t) !== -1; });
    if (FILTER.iter && iterInScope().indexOf(FILTER.iter) === -1) FILTER.iter = "";
    if (FILTER.reldate && FILTER.reldate !== "__none" &&
        dateValues(F_RELDATE).days.indexOf(FILTER.reldate) === -1) FILTER.reldate = "";
  }
  function clearFilter(key) {
    if (key === "epic") {
      // Feature and type options both hang off the Epic, so they go with it.
      FILTER.epics = []; FILTER.feats = []; FILTER.types = []; EPIC_OPEN = false;
    } else if (key === "feature") {
      FILTER.feats = []; FILTER.types = []; FEAT_OPEN = false;
    } else if (key === "types") {
      FILTER.types = []; TYPE_OPEN = false;
    } else if (key === "states") {
      FILTER.states = []; STATE_OPEN = false;
    } else if (key === "owner") {
      FILTER.owner = "";
    } else if (key === "q") {
      FILTER.q = "";
    } else if (key === "notesOnly") {
      FILTER.notesOnly = false;
    } else if (key === "iter") {
      FILTER.iter = "";
    } else if (key === "reldate") {
      FILTER.reldate = "";
    }
    show("tree");
  }

  // ---- the Follow-up cell --------------------------------------------------
  function noteCell(id) {
    var list = notesFor(id);
    if (NOTE_EDIT && NOTE_EDIT.id === String(id)) {
      return '<div class="nedit"><textarea id="nTxt" placeholder="What needs chasing? ' +
        'Type a name to remember who — tagging happens when you post it to ADO.">' +
        esc(NOTE_EDIT.text) + "</textarea>" +
        '<div class="nact"><button class="btn" data-nsave="' + id + '">Save</button>' +
        '<button class="lnk" data-ncancel="1">Cancel</button>' +
        (NOTE_EDIT.idx != null
          ? '<button class="lnk" data-ndel="' + id + '">Delete</button>' : "") +
        "</div></div>";
    }
    var CAP = 3;
    var out = list.slice(0, CAP).map(function (n, i) {
      return '<div class="ncell ' + (n.done ? "done" : "open") + '" data-nopen="' + id +
        '" data-nidx="' + i + '">' +
        '<div class="ntxt">' + esc(n.t) + "</div>" +
        '<div class="nmeta"><span>' + esc(fmtDateTime(n.at)) + "</span>" +
        '<button class="lnk" data-ndone="' + id + '" data-nidx2="' + i + '">' +
          (n.done ? "reopen" : "mark done") + "</button>" +
        '<button class="lnk" data-npost="' + id + '" data-nidx3="' + i + '">post to ADO</button>' +
        "</div></div>";
    }).join("");
    if (list.length > CAP) {
      out += '<div class="nmeta">' + (list.length - CAP) + " older not shown</div>";
    }
    out += '<button class="lnk nadd" data-nadd="' + id + '">' +
      (list.length ? "+ another" : "+ Add note") + "</button>";
    return out;
  }
  function startNote(id, idx) {
    var list = notesFor(id);
    NOTE_EDIT = {id: String(id), idx: (idx == null ? null : idx),
                 text: (idx == null ? "" : (list[idx] || {}).t || "")};
    show("tree");
    var ta = $("nTxt");
    if (ta) { ta.focus(); ta.selectionStart = ta.value.length; }
  }
  function commitNote() {
    if (!NOTE_EDIT) return;
    var id = NOTE_EDIT.id;
    var ta = $("nTxt");
    var text = String(ta ? ta.value : NOTE_EDIT.text || "").trim();
    var list = NOTES[id] || (NOTES[id] = []);
    if (!text) {                       // empty save on an existing note deletes it
      if (NOTE_EDIT.idx != null) list.splice(NOTE_EDIT.idx, 1);
    } else if (NOTE_EDIT.idx != null && list[NOTE_EDIT.idx]) {
      list[NOTE_EDIT.idx].t = text;
      list[NOTE_EDIT.idx].at = new Date().toISOString();
    } else {
      list.unshift({t: text, at: new Date().toISOString(), done: false});
    }
    if (!list.length) delete NOTES[id];
    saveNotes();
    NOTE_EDIT = null;
    show("tree");
  }
  function exportNotes() {
    var json = JSON.stringify(NOTES, null, 2);
    // A sandboxed frame can refuse the download, so the clipboard is the backstop:
    // paste into a file and Import reads it back. One of the two always works.
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json);
    } catch (e) {}
    var blob = new Blob([json], {type: "application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "roadmap-followups-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    window.alert("Follow-up notes copied to your clipboard, and a download of " +
      a.download + " attempted.\n\nIf no file appears, paste the clipboard into a .json " +
      "file — Import reads either one back.");
  }
  function importNotes(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var incoming = JSON.parse(String(r.result));
        if (!incoming || typeof incoming !== "object") throw new Error("not an object");
        // Merge rather than replace, so importing a copy never destroys newer notes.
        var added = 0;
        Object.keys(incoming).forEach(function (k) {
          var mine = NOTES[k] || (NOTES[k] = []);
          (incoming[k] || []).forEach(function (n) {
            if (!n || !n.t) return;
            var dupe = mine.some(function (m) { return m.t === n.t && m.at === n.at; });
            if (!dupe) { mine.push(n); added++; }
          });
          mine.sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
        });
        saveNotes();
        show("tree");
        window.alert("Imported " + added + " note" + (added === 1 ? "" : "s") + ".");
      } catch (e) {
        window.alert("That file could not be read as a notes export.");
      }
    };
    r.readAsText(file);
  }
  function ctlLabel(text, key) {
    var on = activeFilters().indexOf(key) !== -1;
    return "<label>" + esc(text) +
      (on ? '<button class="clrx" data-clr="' + key + '" title="Clear this filter">×</button>'
          : "") + "</label>";
  }
  function dateHit(id, field, want) {
    var v = isoDay(fl(id, field));
    return want === "__none" ? !v : v === want;
  }
  function nodeMatches(id) {
    if (FILTER.notesOnly && !notesFor(id).length) return false;
    if (FILTER.iter) {
      // Prefix match, so a quarter includes its sprints.
      var ip = String(fl(id, F_ITER) || "");
      if (ip !== FILTER.iter && ip.indexOf(FILTER.iter + "\\") !== 0) return false;
    }
    // Work item type. A parent that fails this still appears via subMatch, so a
    // matching story keeps its Epic -> Feature context above it.
    if (FILTER.types.length &&
        FILTER.types.indexOf(String(fl(id, "System.WorkItemType") || "")) === -1) return false;
    if (FILTER.states.length &&
        FILTER.states.indexOf(String(fl(id, F_STATE) || "")) === -1) return false;
    if (FILTER.owner && person(fl(id, F_ASSIGN)) !== FILTER.owner) return false;
    // Compared as yyyy-mm-dd strings. ADO stores these as UTC midnight, so the ISO day
    // round-trips exactly; Date arithmetic would drift a day west of UTC.
    if (FILTER.reldate && !dateHit(id, F_RELDATE, FILTER.reldate)) return false;
    if (FILTER.q) {
      var q = FILTER.q.toLowerCase();
      var hay = (String(fl(id, F_TITLE) || "") + " " + id + " " +
                 String(fl(id, F_TAGS) || "")).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }
  // No depth parameter by design — a caller-supplied depth is what caused children
  // past index 9 to vanish. A cycle guard does the job without the footgun.
  var _smBusy = {};
  function subMatch(id) {
    if (_sm[id] !== undefined) return _sm[id];
    if (_smBusy[id]) return false;
    _smBusy[id] = 1;
    var r = nodeMatches(id);
    if (!r) {
      var ks = KIDS[id] || [];
      for (var i = 0; i < ks.length; i++) { if (subMatch(ks[i])) { r = true; break; } }
    }
    delete _smBusy[id];
    _sm[id] = r;
    return r;
  }
  var TORD = {feature:0, story:1, bug:2};
  var SORD = {blocked:0, prog:1, "new":2, done:3};
  function childSort(a, b) {
    var d = TORD[typeOf(a)] - TORD[typeOf(b)];
    if (d) return d;
    d = SORD[bucket(fl(a, F_STATE))] - SORD[bucket(fl(b, F_STATE))];
    return d || (a - b);
  }
  function miniCounts(id) {
    var g = groupByType(descendants(id));
    var bits = [];
    if (g.feature.length) bits.push(g.feature.length + "F");
    if (g.story.length) bits.push(g.story.length + "S");
    if (g.bug.length) bits.push(g.bug.length + "B");
    return bits.length ? '<span class="cnt">' + bits.join(" · ") + "</span>" : "";
  }
  function treeRow(id, depth, nKids, open) {
    var d = daysLate(id);
    var isEF = typeOf(id) === "feature" || EPICS.indexOf(id) !== -1;
    return '<tr class="lvl' + depth + '">' +
      '<td class="selc"><input type="checkbox" data-sel="' + id + '"' +
        (SEL[String(id)] ? " checked" : "") + ' aria-label="Select ' + id + '"></td>' +
      '<td style="padding-left:' + (8 + depth * 20) + 'px"><div class="itm">' +
        (nKids ? '<button class="caret" data-id="' + id + '">' + (open ? "&#9662;" : "&#9656;") + "</button>"
               : '<span class="caret dot">&middot;</span>') +
        '<span><button class="idbtn" data-open="' + id + '">' + id + "</button> " +
        esc(fl(id, F_TITLE)) +
        (isEF ? miniCounts(id) : "") + "</span></div></td>" +
      '<td class="nowrap"><span class="pill p-type">' + esc(fl(id, "System.WorkItemType")) + "</span></td>" +
      '<td class="nowrap">' + statePill(id) + "</td>" +
      '<td class="nowrap">' + (person(fl(id, F_ASSIGN))
        ? esc(person(fl(id, F_ASSIGN))) : '<span class="muted">unassigned</span>') + "</td>" +
      '<td class="nowrap">' + (stt(id) ? fmtDate(stt(id)) : '<span class="muted">&mdash;</span>') + "</td>" +
      '<td class="nowrap">' + (tgt(id) ? fmtDate(tgt(id)) : '<span class="muted">&mdash;</span>') + "</td>" +
      '<td class="nowrap">' + (fl(id, F_PI) ? fmtDate(fl(id, F_PI))
        : '<span class="muted">&mdash;</span>') + "</td>" +
      // Release date and Release version give way to Follow-up rather than stacking
      // beside it — eleven columns already crowd the row, and both are still on the
      // Manage drawer. Turn the column off and they come straight back.
      (NOTES_ON ? "" :
        '<td class="nowrap">' + (fl(id, F_RELDATE) ? fmtDate(fl(id, F_RELDATE))
          : '<span class="muted">&mdash;</span>') + "</td>" +
        '<td class="nowrap">' + (fl(id, F_RELVER)
          ? esc(fl(id, F_RELVER)) : '<span class="muted">&mdash;</span>') + "</td>") +
      (NOTES_ON ? '<td class="note">' + noteCell(id) + "</td>" : "") +
      '<td class="nowrap">' + (d == null ? '<span class="muted">&mdash;</span>'
        : '<span style="color:#D64000;font-weight:500">' + d + "d late</span>") + "</td>" +
      '<td class="nowrap"><button class="edit" data-edit="' + id + '">Manage</button></td>' +
      "</tr>";
  }
  // autoDepth is the deepest level that opens on its own: 0 opens the roots and stops,

  function applyBulk() {
    if (!BULK || BULK.busy) return;
    var plan = bulkPlan();
    var comment = BULK.comment.trim();
    var work = plan.filter(function (p) { return p.changes.length || comment; });
    BULK.stage = "result"; BULK.busy = true; BULK.results = [];
    BULK.total = work.length; BULK.done = 0;
    renderBulk();

    // One item at a time, each with its own revision test. update_batch exists but
    // cannot carry a per-item concurrency guard, and a single bad item would take the
    // whole batch down with it.
    seq(work, function (p) {
      var id = p.id;
      var rev = M[id] && typeof M[id].rev === "number" ? M[id].rev : null;
      var updates = [];
      if (rev != null) updates.push({op: "test", path: "/rev", value: rev});
      p.changes.forEach(function (c) {
        updates.push({op: "replace", path: "/fields/" + c.b.f,
                      value: adoValue(c.spec, c.now)});
      });
      var errs = [], did = [];
      var step = p.changes.length
        ? mcp("wit_work_item_write", {action: "update", project: PROJECT, id: id,
                                      updates: updates})
            .then(function (res) {
              if (res && res.fields) {
                M[id].fields = M[id].fields || {};
                Object.keys(res.fields).forEach(function (k) { M[id].fields[k] = res.fields[k]; });
                if (typeof res.rev === "number") M[id].rev = res.rev;
                if (DETAIL[id]) {
                  Object.keys(res.fields).forEach(function (k) { DETAIL[id][k] = res.fields[k]; });
                }
                delete REVS[id];
                // Trust ADO's response, not the request: report anything that did not land.
                p.changes.forEach(function (c) {
                  if (sameFieldValue(c.spec, normFor(c.spec, res.fields[c.b.f]), c.now || "")) {
                    did.push(c.b.label);
                  } else {
                    errs.push(c.b.label + " did not change");
                  }
                });
              } else {
                errs.push("no response from ADO");
              }
            })
            .catch(function (e) { errs.push(adoError(e).slice(0, 220)); })
        : Promise.resolve();

      return step.then(function () {
        // A rejected field patch must not silently swallow the comment, and vice versa.
        if (!comment) return null;
        return mcp("wit_work_item_comment_write", {
          action: "add", project: PROJECT, workItemId: id,
          text: comment, format: "Markdown"
        }).then(function () { did.push("comment posted"); })
          .catch(function (e) { errs.push("comment: " + adoError(e).slice(0, 180)); });
      }).then(function () {
        BULK.results.push({id: id, errs: errs, did: did});
        BULK.done++;
        renderBulk();
      });
    }).then(function () {
      BULK.busy = false;
      renderBulk();
    });
  }

  // Iteration paths present in the current Epic/Feature scope. Offering a sprint the

  function scopeWithRoots() {
