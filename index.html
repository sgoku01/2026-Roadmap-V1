  }
  function loadSupport(force) {
    if (SUP.loading || (SUP.rows && !force)) return Promise.resolve();
    SUP.loading = true; SUP.err = null;
    if (force) SUP.rows = null;
    show("support");
    // Assigned-to is matched on the email rather than @Me so the result does not
    // depend on whose session runs it.
    var wiql = "SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = '" +
      SUP_PROJECT + "' AND [System.AssignedTo] = '" + ME_EMAIL +
      "' AND [System.State] <> 'Removed' ORDER BY [System.ChangedDate] DESC";
    return mcpSup("wit_query", {action: "wiql", project: SUP_PROJECT,
                                responseType: "ids", top: 300, wiql: wiql})
      .then(function (r) {
        var ids = (r.workItems || []).map(function (w) { return w.id; })
                    .concat(r.ids || []);
        if (!ids.length) return [];
        return seq(chunk(ids, 100), function (c) {
          return mcpSup("wit_work_item", {
            action: "get_batch", project: SUP_PROJECT, ids: c,
            fields: ["System.Id", "System.Title", "System.WorkItemType", "System.State",
                     "System.AreaPath", "System.CreatedDate", "System.ChangedDate",
                     "System.Tags", "Microsoft.VSTS.Common.Severity",
                     "Microsoft.VSTS.Common.Priority"]
          }).catch(function () { return []; });
        }).then(function (batches) {
          var out = [];
          batches.forEach(function (b) {
            (Array.isArray(b) ? b : []).forEach(function (wi) {
              var f = wi.fields || {};
              out.push({
                id: wi.id, title: f["System.Title"] || "",
                type: f["System.WorkItemType"] || "",
                state: f["System.State"] || "",
                area: String(f["System.AreaPath"] || "").replace(/^SurePrep Support\\?/, ""),
                created: f["System.CreatedDate"] || "",
                changed: f["System.ChangedDate"] || "",
                tags: f["System.Tags"] || "",
                sev: f["Microsoft.VSTS.Common.Severity"] || "",
                pri: f["Microsoft.VSTS.Common.Priority"]
              });
            });
          });
          return out;
        });
      })
      .then(function (rows) {
        SUP.rows = rows;
        SUP.at = new Date();
        SUP.loading = false;
        if (active === "support") show("support");
      })
      .catch(function (e) {
        SUP.err = adoError(e).slice(0, 400) || "could not read the support board";
        SUP.loading = false;
        if (active === "support") show("support");
      });
  }
  // Patch one row of the support list from ADO's own post-save response, so the tab
  // reflects the change without a full re-query.
  function supSync(id, f) {
    if (!SUP.rows) return;
    for (var i = 0; i < SUP.rows.length; i++) {
      if (SUP.rows[i].id !== Number(id)) continue;
      var r = SUP.rows[i];
      if (f["System.Title"] !== undefined) r.title = f["System.Title"] || "";
      if (f["System.State"] !== undefined) r.state = f["System.State"] || "";
      if (f["System.Tags"] !== undefined) r.tags = f["System.Tags"] || "";
      if (f["Microsoft.VSTS.Common.Severity"] !== undefined) {
        r.sev = f["Microsoft.VSTS.Common.Severity"] || "";
      }
      if (f["System.AreaPath"] !== undefined) {
        r.area = String(f["System.AreaPath"] || "").replace(/^SurePrep Support\\?/, "");
      }
      if (f["System.ChangedDate"] !== undefined) r.changed = f["System.ChangedDate"] || "";
      // Reassigned away from her: it no longer belongs on "my" tickets.
      if (f["System.AssignedTo"] !== undefined) {
        var em = String(personEmail(f["System.AssignedTo"]) || "").toLowerCase();
        r.notMine = !!em && em !== ME_EMAIL.toLowerCase();
      }
      break;
    }
    if (active === "support") show("support");
  }
  function ageDays(iso) {
    var t = dt(iso);
    return t ? days(t, NOW) : null;
  }
  function supRow(r) {
    var a = ageDays(r.created), idle = ageDays(r.changed);
    return "<tr>" +
      '<td class="nowrap"><button class="idbtn" data-supopen="' + r.id + '">' + r.id +
        "</button></td>" +
      '<td class="title">' + esc(r.title) +
        (r.tags ? ' <span class="cnt">' + esc(r.tags) + "</span>" : "") +
        (r.notMine ? ' <span class="flag">reassigned \u2014 no longer yours</span>' : "") +
        "</td>" +
      '<td class="nowrap">' + supStatePill(r.state) + "</td>" +
      '<td class="nowrap">' + esc(r.area || "—") + "</td>" +
      '<td class="nowrap">' + esc(r.sev || "—") + "</td>" +
      '<td class="nowrap">' + (a == null ? "—" : a + "d") + "</td>" +
      '<td class="nowrap">' + (idle == null ? "—"
        : (idle >= STALE_DAYS ? '<span style="color:#D64000;font-weight:500">' + idle +
             "d</span>" : idle + "d")) + "</td>" +
      // Last column, matching the Drill-down table.
      '<td class="nowrap"><button class="edit" data-supedit="' + r.id + '">Manage</button></td>' +
      "</tr>";
  }
  // The support board runs its own state set (Waiting on Support, In Progress, …), so
  // the roadmap's buckets do not apply — these are coloured on their own terms.
  function supStatePill(st) {
    var l = String(st || "").toLowerCase();
    var cls = SUP_DONE[l] ? "p-done"
      : /waiting/.test(l) ? "p-blk"
      : /progress|active/.test(l) ? "p-prog" : "p-new";
    return '<span class="pill ' + cls + '">' + esc(st || "—") + "</span>";
  }
  function paneSupport() {
    // Covers the first paint too, before the fetch has even been kicked off —
    // otherwise the pane flashes "all clear" for an instant.
    if (!SUP.rows && !SUP.err) {
      return '<div class="empty">Reading your tickets from the SurePrep Support board…</div>';
    }
    if (SUP.err) {
      return '<div class="alert"><span class="hl">Could not read the support board</span> ' +
        "&mdash; " + esc(SUP.err) + "</div>" +
        '<div class="rowctl"><button class="btn" id="supRetry">Try again</button></div>';
    }
    var rows = SUP.rows || [];
    var open = rows.filter(supOpen);
    var closed = rows.filter(function (r) { return !supOpen(r); });
    var waiting = open.filter(function (r) { return /waiting/i.test(r.state); });
    var stale = open.filter(function (r) {
      var i = ageDays(r.changed);
      return i != null && i >= STALE_DAYS;
    });
    var head = "<tr><th>ID</th><th>Title</th><th>State</th><th>Area</th>" +
      "<th>Severity</th><th>Age</th><th>Idle</th><th></th></tr>";

    return '<div class="rowctl"><span class="scope">Assigned to <b>you</b> on ' +
        esc(SUP_ORG + " / " + SUP_PROJECT) + " &middot; " + rows.length + " ticket" +
        (rows.length === 1 ? "" : "s") + " &middot; read from ADO " +
        (SUP.at ? esc(fmtDateTime(SUP.at.toISOString())) : "just now") + "</span>" +
        '<span style="margin-left:auto;display:flex;gap:14px;align-items:center">' +
          '<button class="lnk" id="supRefresh">Refresh</button>' +
          (closed.length
            ? '<button class="lnk" id="supToggle">' +
              (SUP.showClosed ? "Hide" : "Show") + " " + closed.length +
              " closed</button>" : "") +
        "</span></div>" +
      '<div class="kpis">' +
        kpi(open.length, "Open", open.length ? "warn" : "good") +
        kpi(waiting.length, "Waiting on Support", waiting.length ? "" : "good",
            waiting.length ? "ball is on their side" : "nothing parked") +
        kpi(stale.length, "No update in " + STALE_DAYS + "d+", stale.length ? "bad" : "good") +
        kpi(closed.length, "Closed", "good") +
      "</div>" +
      "<h2>Open tickets</h2>" +
      (open.length
        ? "<table><thead>" + head + "</thead><tbody>" +
          open.sort(function (a, b) {
            return (ageDays(b.changed) || 0) - (ageDays(a.changed) || 0);
          }).map(supRow).join("") + "</tbody></table>"
        : '<div class="empty">Nothing open — all clear.</div>') +
      (SUP.showClosed && closed.length
        ? "<h2>Closed tickets</h2><table><thead>" + head + "</thead><tbody>" +
          closed.map(supRow).join("") + "</tbody></table>"
        : "") +
      '<div class="more">This board is a different Azure DevOps organisation from your ' +
        "roadmap, so nothing here is counted anywhere else in the dashboard. Click an id " +
        "to read a ticket in full, or Manage to edit it and post to its Discussion \u2014 " +
        "every change is confirmed before it is written, exactly as on the roadmap.</div>";
  }
  function wireSupport() {
    if ($("supRefresh")) $("supRefresh").onclick = function () { loadSupport(true); };
    if ($("supRetry")) $("supRetry").onclick = function () { loadSupport(true); };
    if ($("supToggle")) $("supToggle").onclick = function () {
      SUP.showClosed = !SUP.showClosed;
      show("support");
    };
    // Same drawer as the roadmap, pointed at the support organisation: the id opens
    // the read-only detail view, Manage opens it on the editable sections.
    Array.prototype.forEach.call(
      document.querySelectorAll("#panes [data-supopen]"), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          openEditor(b.getAttribute("data-supopen"), "details", false, null, SUPPORT_CTX);
        };
      });
    Array.prototype.forEach.call(
      document.querySelectorAll("#panes [data-supedit]"), function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          openEditor(b.getAttribute("data-supedit"), "core", false, null, SUPPORT_CTX);
        };
      });
  }

  // ---- Bugs --------------------------------------------------------------
  function paneBugs() {
    var open = BUGS.filter(isOpen);
    var aged = open.filter(function (b) {
      var c = dt(fl(b, "System.CreatedDate"));
      return c && days(c, NOW) > 30;
    });
    var closed30 = BUGS.filter(function (b) {
      var c = dt(fl(b, "Microsoft.VSTS.Common.ClosedDate"));
      return c && days(c, NOW) <= 30;
    });
    return '<div class="kpis">' +
        kpi(BUGS.length, "Linked to roadmap") +
        kpi(open.length, "Open", open.length ? "warn" : "good") +
        kpi(aged.length, "Open over 30 days", aged.length ? "bad" : "good") +
        kpi(closed30.length, "Closed last 30 days", "good") +
      "</div>" +
      '<div class="chartbox" style="max-width:460px"><canvas id="c-sev"></canvas></div>' +
      "<h2>Open bugs, oldest first</h2>" +
      rows(open.sort(function (a, b) {
        return (dt(fl(a,"System.CreatedDate")) || 0) - (dt(fl(b,"System.CreatedDate")) || 0);
      }), [COL.id, COL.title, COL.state, COL.sev, COL.owner, COL.epic, COL.age, COL.edit], 30);
  }

  // ---- Risks -------------------------------------------------------------
  var RFILTER = {epic:"", feature:""};
  function riskScope() {
    if (RFILTER.feature && M[RFILTER.feature]) {
      var fid = Number(RFILTER.feature);
      return [fid].concat(descendants(fid));
    }
    if (RFILTER.epic && M[RFILTER.epic]) {
      var eid = Number(RFILTER.epic);
      return [eid].concat(descendants(eid));
    }
    return Object.keys(M).map(Number);
  }
  function paneRisks() {
    var scope = riskScope();
    var openAll = scope.filter(function (id) { return EPICS.indexOf(id) === -1 && isOpen(id); });
    var ef = scope.filter(isEpicOrFeature).filter(isOpen);
    var TR = triage(ef);
    var blocked = openAll.concat(scope.filter(function (id) { return EPICS.indexOf(id) !== -1 && isOpen(id); }))
      .filter(function (id) {
        return bucket(fl(id, F_STATE)) === "blocked" ||
               /(^|;|\s)(blocked|on hold|at risk)(;|\s|$)/i.test(String(fl(id, F_TAGS) || ""));
      });
    var stale = openAll.filter(isStale);
    var noOwner = openAll.filter(function (id) {
      return !person(fl(id, F_ASSIGN)) && bucket(fl(id, F_STATE)) !== "new";
    });

    var label = RFILTER.feature && M[RFILTER.feature]
      ? "Feature " + RFILTER.feature + " and everything under it"
      : (RFILTER.epic && M[RFILTER.epic]
          ? "Epic " + RFILTER.epic + " and everything under it" : "the whole roadmap");

    return '<div class="rowctl">' +
        '<div class="ctl"><label>Epic</label>' + epicSelect("rEpic", RFILTER.epic, "All Epics") + "</div>" +
        '<div class="ctl"><label>Feature</label>' + featSelect("rFeat", RFILTER.epic, RFILTER.feature) + "</div>" +
        '<div class="ctl"><label>&nbsp;</label><div><button class="lnk" id="rReset">Reset scope</button></div></div>' +
      "</div>" +
      '<div class="rowctl"><span class="scope">Showing risks across <b>' + esc(label) + "</b></span></div>" +
      '<div class="kpis">' +
        kpi(TR.decide.length, "Need a decision", TR.decide.length ? "bad" : "good",
            "breached " + DECIDE_DAYS + "d or more ago") +
        kpi(TR.slip.length, "Slipping now", TR.slip.length ? "warn" : "good",
            TR.slip.length ? "worst " + daysLate(TR.slip[0]) + "d late" : "none") +
        kpi(TR.soon.length, "Due in 14 days", "", "still on time") +
        kpi(TR.nodate.length, "No start/target", TR.nodate.length ? "warn" : "good",
            "can't be tracked") +
        kpi(blocked.length, "Blocked / flagged", blocked.length ? "bad" : "good") +
        kpi(stale.length, "Idle " + STALE_DAYS + "d+", stale.length ? "warn" : "good") +
        kpi(noOwner.length, "No owner", noOwner.length ? "warn" : "good") +
      "</div>" +
      "<h2>Schedule</h2>" +
      triGroup(TR.decide.length + " need a decision",
        "Broke their date " + DECIDE_DAYS + "+ days ago. These are not slipping plans — " +
        "they are items to close, re-baseline or drop.", TR.decide, true, 15) +
      triGroup(TR.slip.length + " slipping now",
        "Breached within the last " + DECIDE_DAYS + " days. Worth chasing an owner.",
        TR.slip, true, 15) +
      triGroup(TR.soon.length + " due within 14 days",
        "Still on time — confirm they will land.", TR.soon, false, 10) +
      triGroup(TR.nodate.length + " with no start or target date",
        "Invisible to every schedule check above.", TR.nodate, false, 10) +
      "<h2>Blocked or flagged at risk</h2>" +
      rows(blocked, [COL.id, COL.type, COL.title, COL.state, COL.owner, COL.epic, COL.edit], 15) +
      "<h2>Active but no update in " + STALE_DAYS + "+ days</h2>" +
      rows(stale.sort(function (a, b) {
        return (dt(fl(a,"System.ChangedDate")) || 0) - (dt(fl(b,"System.ChangedDate")) || 0);
      }), [COL.id, COL.type, COL.title, COL.state, COL.owner, COL.epic, COL.idle, COL.edit], 15) +
      (noOwner.length ? "<h2>Open, in progress and unowned</h2>" +
        rows(noOwner, [COL.id, COL.type, COL.title, COL.state, COL.iter, COL.epic, COL.edit], 15) : "") +
      // The analysis lives here rather than on Overview, which is now a plain to-do list.
      "<h2>How long have things been late?</h2>" +
      '<div class="chartbox" style="height:190px;max-width:580px"><canvas id="c-age"></canvas></div>' +
      '<div class="hint" style="max-width:580px">Whole roadmap, not affected by the Epic and ' +
      "Feature filters above. Mostly-old bars mean a housekeeping problem — items nobody " +
      "closed. Mostly-recent bars mean a delivery problem.</div>";
  }
  function wireRisks() {
    var e = $("rEpic");
    if (e) e.onchange = function () { RFILTER.epic = e.value; RFILTER.feature = ""; show("risks"); };
    var ft = $("rFeat");
    if (ft) ft.onchange = function () { RFILTER.feature = ft.value; show("risks"); };
    var r = $("rReset");
    if (r) r.onclick = function () { RFILTER = {epic:"", feature:""}; show("risks"); };
  }

  // ---- charts ------------------------------------------------------------
  function killCharts() {
    Object.keys(charts).forEach(function (k) {
      try { charts[k].destroy(); } catch (e) {}
      delete charts[k];
    });
  }
  // Replaces two charts that could not work. A shared count axis let 617 stories
  // flatten 63 features and 79 bugs into slivers — that job now belongs to the
  // per-type normalised bars in the health strip. And colouring epic-completion bars
  // by "breached" encoded nothing once nearly every epic was breached. What is
  // genuinely worth a picture is the AGE of the slippage, because that is what
  // decides whether an item needs chasing or closing.
  function drawAgeChart() {
    if (typeof Chart === "undefined") return;
    var el = $("c-age");
    if (!el) return;
    var T = triage();
    var all = T.decide.concat(T.slip);
    var bands = [[0, 30, "1–30 days"], [31, 90, "31–90 days"],
                 [91, 180, "91–180 days"], [181, Infinity, "Over 180 days"]];
    var data = bands.map(function (b) {
      return all.filter(function (id) {
        var d = daysLate(id) || 0;
        return d >= b[0] && d <= b[1];
      }).length;
    });
    charts.age = new Chart(el, {
      type: "bar",
      // Grey through to the darkest orange: the further down, the less this is a
      // schedule problem and the more it is an unclosed-work problem.
      data: {labels: bands.map(function (b) { return b[2]; }),
        datasets: [{data: data, borderRadius: 2,
          backgroundColor: ["#9F9F9F", "#E68C66", "#D64000", "#561A00"]}]},
      options: {indexAxis: "y", responsive: true, maintainAspectRatio: false,
        scales:{x:{grid:{color:"#E5E5E5"},
            ticks:{precision:0, color:"#212223", font:{size:10}}},
          y:{grid:{display:false},
            ticks:{color:"#212223", font:{size:11, family:"Clario, Arial, sans-serif"}}}},
        plugins:{legend:{display:false},
          title:{display:true, text:"Breached epics and features, by how long ago",
            color:"#123015", font:{size:12.5, weight:"500", family:"Clario, Arial, sans-serif"}}}}
    });
  }
  function drawBugChart() {
    if (typeof Chart === "undefined") return;
    var open = BUGS.filter(isOpen), sev = {};
    open.forEach(function (b) {
      var s = String(fl(b, F_SEV) || "Unspecified");
      sev[s] = (sev[s] || 0) + 1;
    });
    var keys = Object.keys(sev).sort();
    var el = $("c-sev");
    if (el && keys.length) charts.sev = new Chart(el, {
      type: "doughnut",
      // Monochromatic TR Orange family — the brand colour must appear in the set
      data: {labels: keys, datasets: [{data: keys.map(function (k) { return sev[k]; }),
        backgroundColor: ["#561A00","#AB3300","#D64000","#E68C66","#EFB399"], borderWidth: 0}]},
      options: {responsive:true, maintainAspectRatio:false,
        plugins:{legend:{position:"right",
            labels:{boxWidth:10, font:{size:11, family:"Clario, Arial, sans-serif"}, color:"#212223"}},
          title:{display:true, text:"Open bugs by severity", color:"#123015",
            font:{size:12.5, weight:"500", family:"Clario, Arial, sans-serif"}}}}
    });
  }

  // ---- chrome ------------------------------------------------------------
  function show(tab) {
    active = tab;
    try { localStorage.setItem("adoTrackerTab", tab); } catch (e) {}
    Array.prototype.forEach.call($("nav").children, function (b) {
      b.className = b.dataset.k === tab ? "on" : "";
    });
    killCharts();
    $("panes").innerHTML =
        tab === "overview" ? paneOverview()
      : tab === "epics"    ? paneEpics()
      : tab === "tree"     ? paneTree()
      : tab === "bugs"     ? paneBugs()
      : tab === "support"  ? paneSupport()
      : paneRisks();

    if (tab === "risks") drawAgeChart();
    if (tab === "bugs") drawBugChart();
    if (tab === "tree") wireTree();
    if (tab === "risks") wireRisks();
    if (tab === "support") {
      wireSupport();
      // Fetched on first open rather than at startup: it is a second organisation and
      // the roadmap should not wait on it.
      if (!SUP.rows && !SUP.loading && !SUP.err) loadSupport(false);
    }
    wireExports((TABS.filter(function (t) { return t.k === tab; })[0] || {}).n || "Export");

    Array.prototype.forEach.call(document.querySelectorAll("#panes .caret[data-id]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-id");
        EXPAND[id] = !(EXPAND[id] === true);
        show("tree");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("#panes [data-edit]"), function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        openEditor(btn.getAttribute("data-edit"), "core");
      };
    });
    // Clicking a work item id opens it here rather than navigating to ADO. Selector is
    // document-wide, not #panes — the date-breach banner sits outside the pane.
    Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        openEditor(btn.getAttribute("data-open"), "details");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("#panes .drillin"), function (btn) {
      btn.onclick = function () {
        FILTER = blankFilter();
        FILTER.epics = [btn.getAttribute("data-id")];
        EXPAND = {};
        STATE_OPEN = false; TYPE_OPEN = false; EPIC_OPEN = false; FEAT_OPEN = false;
        show("tree");
      };
    });
    // Verdict chips jump to the full, uncapped lists.
    Array.prototype.forEach.call(document.querySelectorAll("[data-goto]"), function (btn) {
      btn.onclick = function () {
        RFILTER = {epic:"", feature:""};
        show(btn.getAttribute("data-goto"));
      };
    });
  }

  function render() {
    stats = EPICS.map(epicStats);
    var g = allByType();
    var tf = tally(g.feature), ts = tally(g.story), tb = tally(g.bug);
    var totalKids = tf.total + ts.total, doneKids = tf.done + ts.done;
    var overall = totalKids ? Math.round(doneKids / totalKids * 100) : 0;
    // Health strip. One bar per type, each normalised to its own total — a shared
    // count axis made 63 features and 79 bugs invisible next to 617 stories.
    var seg = function (v, total, c) {
      return v ? '<i style="width:' + (v / total * 100) + '%;background:' + c + '"></i>' : "";
    };
    var trow = function (name, t, doneWord) {
      var n = t.total || 1;
      return '<div class="trow"><span class="nm">' + name + "</span>" +
        '<span class="ct">' + t.total + "</span>" +
        '<span class="sb">' + seg(t.done, n, "#123015") + seg(t.prog, n, "#0874E3") +
          seg(t["new"], n, "#E5E5E5") + seg(t.blocked, n, "#D64000") + "</span>" +
        '<span class="mix">' + t.done + " " + doneWord + " · " + t.prog +
          " in progress · " + t["new"] + " not started" +
          (t.blocked ? " · " + t.blocked + " blocked" : "") + "</span></div>";
    };
    $("kpis").className = "";
    $("kpis").innerHTML =
      '<div class="hstrip">' +
        '<div class="lead"><span class="pc">' + overall + "%</span>" +
          '<span class="lbl">of the roadmap delivered &mdash; <b>' + doneKids + "</b> of " +
          totalKids + " features and user stories closed, across " + EPICS.length +
          " epics</span></div>" +
        '<div class="bar mainbar ' + (overall >= 80 ? "ok" : "") +
          '"><i style="width:' + overall + '%"></i></div>' +
        trow("Features", tf, "done") +
        trow("User stories", ts, "done") +
        trow("Bugs", tb, "closed") +
        '<div class="legend">' +
          '<span><i style="background:#123015"></i>Done</span>' +
          '<span><i style="background:#0874E3"></i>In progress</span>' +
          '<span><i style="background:#E5E5E5"></i>Not started</span>' +
          '<span><i style="background:#D64000"></i>Blocked</span>' +
          '<span style="margin-left:auto">Resolved counts as in progress, Ready as not started</span>' +
        "</div>" +
        '<div class="hint">Scope: the <b>' + EPICS.length + "</b> epics assigned to you with an " +
          "iteration under <code>" + SCOPE_ITER + "</code>, plus their features and user stories " +
          "in the same year." +
          (OUT_OF_SCOPE ? " <b>" + OUT_OF_SCOPE + "</b> item" + (OUT_OF_SCOPE === 1 ? "" : "s") +
            " returned by the saved query only to keep the hierarchy joined — other years or " +
            "other owners — " + (OUT_OF_SCOPE === 1 ? "is" : "are") +
            " excluded from every number on this page." : "") +
          (EXCLUDED_N ? " <b>" + EXCLUDED_N + "</b> " + EXCLUDED_TYPES.join(" / ") +
            " item" + (EXCLUDED_N === 1 ? " is" : "s are") +
            " excluded by design — they are the teams' execution breakdown, not roadmap scope." : "") +
        "</div>" +
      "</div>";

    // If the tree hit the row cap, nothing below can be trusted — say so first.
    var pre = (TRUNCATED
      ? '<div class="alert"><span class="hl">Results were truncated</span> &mdash; the saved query ' +
        "returned at least " + REL_CAP + " rows, so some items are missing from every count on this " +
        "page. Narrow the query or raise the cap before relying on these numbers.</div>"
      : "") +
      (CHILD_CAPPED
      ? '<div class="alert"><span class="hl">Some Bugs or Tasks may be missing</span> &mdash; a ' +
        "child lookup returned its maximum of 400 rows, so the Bug and Task counts below are a " +
        "floor, not a total. Everything at Feature and User Story level is unaffected.</div>"
      : "");

    // Verdict. One sentence saying what is true, then the split that decides what to
    // do about it, then chips into the full lists. The old banner led with a count and
    // five arbitrary examples, which told you the size of the problem but not its shape.
    var T = triage();
    var nBreach = T.decide.length + T.slip.length;
    var epicsTouched = EPICS.filter(function (e) {
      if (isOpen(e) && breached(e)) return true;
      return descendants(e).some(function (k) {
        return isEpicOrFeature(k) && isOpen(k) && breached(k);
      });
    });
    var verdict;
    if (nBreach) {
      // Everyday words only. The previous wording leaned on "live slippage" and
      // "unclosed work needing a decision", which describe the situation accurately
      // but make you decode the sentence before you can act on it.
      verdict = '<div class="verdict"><div class="big"><b>' + nBreach + "</b> of your " +
        T.ef.length + " open epics and features are late.</div>" +
        '<div class="sml">' +
        (T.decide.length && T.slip.length
          ? "<b>" + T.decide.length + "</b> have been late for months — close those or give " +
            "them a new date. The other <b>" + T.slip.length + "</b> slipped recently and are " +
            "still worth chasing."
          : T.decide.length
            ? "All of them have been late for months. Close them or give them new dates — " +
              "chasing will not help."
            : "All of them slipped recently, so they are still worth chasing.") +
        (epicsTouched.length
          ? " " + (epicsTouched.length === EPICS.length
              ? "Every one of your " + EPICS.length + " epics is affected."
              : epicsTouched.length + " of your " + EPICS.length + " epics are affected.")
          : "") +
        "</div><div class=\"vchips\">" +
        (T.decide.length ? '<button class="vchip hot" data-goto="risks">' + T.decide.length +
          " to decide on</button>" : "") +
        (T.slip.length ? '<button class="vchip hot" data-goto="risks">' + T.slip.length +
          " to chase</button>" : "") +
        (T.soon.length ? '<button class="vchip" data-goto="risks">' + T.soon.length +
          " due soon</button>" : "") +
        (T.nodate.length ? '<button class="vchip" data-goto="risks">' + T.nodate.length +
          " with no dates</button>" : "") +
        "</div></div>";
    } else {
      verdict = '<div class="verdict"><div class="big">No open epic or feature has breached ' +
        "a date.</div>" +
        (T.nodate.length ? '<div class="sml">Worth a look, though: <b>' + T.nodate.length +
          "</b> have no start or target date, so they can never show as late.</div>" +
          '<div class="vchips"><button class="vchip" data-goto="risks">' + T.nodate.length +
          " with no dates</button></div>" : "") + "</div>";
    }
    $("alert").innerHTML = pre + verdict;

    $("nav").innerHTML = TABS.map(function (t) {
      return '<button data-k="' + t.k + '">' + t.n + "</button>";
    }).join("");
    Array.prototype.forEach.call($("nav").children, function (b) {
      b.onclick = function () { show(b.dataset.k); };
    });

    $("asof").textContent = " · refreshed " +
      NOW.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    $("note").innerHTML =
      "<b>Reading the colours.</b> TR Orange marks a date breach or a blocker; TR Racing Green marks " +
      "done or on schedule; grey is neutral or inactive. The TR palette has no red/amber/green traffic " +
      "light — the alert colours are retired — so urgency is carried by the signature orange instead.<br>" +
      "<b>Past target</b> = target date gone by and not closed. <b>Past start</b> = start date gone by " +
      "but still new or ready. <b>Idle</b> = days since any field changed. " +
      "Epic % covers features and user stories only; bugs are counted separately. " +
      "<code>Resolved</code> counts as in progress; <code>Ready</code> counts as not started.<br>" +
      "<b>Why the " + DECIDE_DAYS + "-day split.</b> An item that broke its date this month and one " +
      "that broke it eighteen months ago are not the same problem, and listing them together makes " +
      "the whole roadmap look equally on fire. Anything breached " + DECIDE_DAYS + "+ days ago is " +
      "shown as <b>needs a decision</b> — the honest options are close it, re-baseline it or drop " +
      "it, and no amount of chasing will move it. Anything more recent is <b>slipping now</b> and is " +
      "the list actually worth working. The cut is a rule of thumb, not a fact about your delivery; " +
      "ask me to move it if 90 days is wrong for this portfolio.<br>" +
      "<b>Click any work item id</b> to open it right here — all fields, the description and " +
      "acceptance criteria as written, tags, linked work you can click straight through, and a " +
      "change history built from the item’s ADO revisions. Two things genuinely cannot be shown " +
      "in this page: images embedded in a description, and file attachments — both are served " +
      "from dev.azure.com, which the viewer cannot reach. Those are marked where they occur, and " +
      "the <b>open in ADO</b> link in the drawer header is there for them.<br>" +
      "<b>Manage</b> opens the same drawer on the editable fields, and writes state, " +
      "owner, iteration, area, dates, points, effort, priority, severity, risk, value area, title, " +
      "tags, description, acceptance criteria and Discussion comments straight back to ADO once you " +
      "confirm each change old&nbsp;&rarr;&nbsp;new. Saves carry a revision check, so if a teammate " +
      "has touched the item since you opened it the write is refused rather than applied over theirs. " +
      "<code>Removed</code> is never offered as a state. Description and acceptance criteria are " +
      "plain-text in and out — replacing one discards the original’s rich formatting, so append " +
      "when you only mean to add. Refreshes from ADO on every open.";

    loadNotes();
    try { NOTES_ON = localStorage.getItem("adoTrackerNotesCol") !== "0"; } catch (e) {}

    var saved = "overview";
    try { saved = localStorage.getItem("adoTrackerTab") || "overview"; } catch (e) {}
    statusEl.classList.add("hide");
    $("app").classList.remove("hide");
    // Anyone whose last tab was Iteration lands on Drill-down, where it now lives.
    if (saved === "sprint") saved = "tree";
    show(TABS.some(function (t) { return t.k === saved; }) ? saved : "overview");
  }

  load().then(render).catch(function (e) {
    console.error("ADO tracker load failed", e);
    setStatus("Could not load from Azure DevOps: " + (e && e.message ? e.message : e) +
              " — try the Reload button in the header.", true);
  });
})();
</script>
</body>
</html>
